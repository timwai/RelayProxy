# 客户端填写服务端地址，并通过 GUI 受保护凭据存储或
# RELAYPROXY_ACCESS_KEY 环境变量配置身份接入密钥。密钥不写入本文件。
# 首次连接会自动生成安装身份，并登记到接入密钥对应的服务端身份。
server:
  address: relay.example.com

# P2P 直连默认自动启用：首个连接立即走 Relay，后台建立直连；
# 后续连接优先复用 P2P QUIC。relay_only 可完全关闭直连尝试。
p2p:
  enabled: true
  mode: auto
  punch_timeout_ms: 1200
  keepalive_sec: 10
  idle_timeout_sec: 120
  max_exit_sessions: 4
  fallback: true
