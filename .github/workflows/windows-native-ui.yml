name: Windows Native UI

on:
  push:
    branches:
      - main
      - feat/windows-native-gui
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/app/**"
      - "agent/bridge/bridge.go"
      - "agent/gui/**"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"
  pull_request:
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/app/**"
      - "agent/bridge/bridge.go"
      - "agent/gui/**"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"

permissions:
  contents: read

concurrency:
  group: windows-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Check native bridge Go formatting
        run: |
          files=(
            agent/app/agent.go
            agent/app/status_capabilities_test.go
            agent/bridge/bridge.go
            agent/gui/web.go
            agent/gui/web_test.go
            agent/gui/gui_windows_core.go
            agent/gui/gui_windows.go
            agent/gui/bindings_windows.go
            agent/gui/connections_windows.go
            agent/gui/restart_windows.go
            agent/gui/connections_native_windows_test.go
            agent/gui/restart_windows_test.go
            agent/startup/startup_windows.go
            agent/startup/startup_other.go
            cmd/relay-agent/main.go
            scripts/fetch-windivert.go
          )
          bad="$(gofmt -l "${files[@]}")"
          if [ -n "$bad" ]; then
            for file in $bad; do
              gofmt -d "$file"
            done
            exit 1
          fi

  build:
    needs: format
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            goarch: amd64
            artifact: windows-amd64-native
          - runtime: win-arm64
            platform: ARM64
            goarch: arm64
            artifact: windows-arm64-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test native Core bridge
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/gui ./agent/bridge ./agent/startup -count=1

      - name: Test legacy Wails fallback
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test -tags wailslegacy ./agent/gui -count=1

      - name: Test Agent capability status
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/app -run TestStatusApprovedCapabilitiesReturnsDefensiveCopy -count=1

      - name: Validate PowerShell release scripts
        shell: pwsh
        run: |
          $scripts = @(
            ".\scripts\build.ps1",
            ".\scripts\build-windows-native.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "$script has syntax errors"
            }
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj -r ${{ matrix.runtime }}

      - name: Build
        shell: pwsh
        run: dotnet build .\windows\RelayProxy.Native\RelayProxy.Native.csproj -c Release -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} --no-restore

      - name: Build embedded Go Agent core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\staging\${{ matrix.runtime }}" -Force | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o ".\staging\${{ matrix.runtime }}\relay-agent.exe" .\cmd\relay-agent

      - name: Publish native GUI single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\single\${{ matrix.runtime }}" -Force | Out-Null
          $core = (Resolve-Path ".\staging\${{ matrix.runtime }}\relay-agent.exe").Path
          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:RelayAgentCorePath="$core" `
            --self-contained true `
            --no-restore `
            -o .\single\${{ matrix.runtime }}

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $dir = ".\single\${{ matrix.runtime }}"
          $exe = Join-Path $dir "relay-agent-gui.exe"
          if (-not (Test-Path $exe)) { throw "relay-agent-gui.exe missing from single-file publish" }
          $extra = @(Get-ChildItem -LiteralPath $dir -Force | Where-Object { $_.Name -ne "relay-agent-gui.exe" })
          if ($extra.Count -gt 0) {
            throw "single-file publish has sidecars: $($extra.Name -join ', ')"
          }
          New-Item -ItemType Directory -Path ".\artifacts\${{ matrix.runtime }}" -Force | Out-Null
          Copy-Item $exe ".\artifacts\${{ matrix.runtime }}\relay-agent-gui.exe" -Force

      - name: Build Go Agent core
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -o ".\artifacts\${{ matrix.runtime }}\relay-agent.exe" .\cmd\relay-agent

      - name: Build legacy Wails fallback
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -trimpath -tags wailslegacy -ldflags "-H=windowsgui" -o ".\artifacts\${{ matrix.runtime }}\relay-agent-wails.exe" .\cmd\relay-agent

      - name: Verify release layout
        shell: pwsh
        run: |
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent-gui.exe")) { throw "relay-agent-gui.exe missing" }
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent.exe")) { throw "relay-agent.exe missing" }
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent-wails.exe")) { throw "relay-agent-wails.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .\artifacts\${{ matrix.runtime }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RelayProxy-agent-${{ matrix.runtime }}-single-exe
          path: .\single\${{ matrix.runtime }}\relay-agent-gui.exe
          if-no-files-found: error
