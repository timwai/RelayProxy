const transfers=[{id:'t1',direction:'down',file:'发布版本.zip',from:'Windows 台式机 / 公共资料',size:1476395008,bytes:672137216,speed:17616076,status:'active',path:'P2P QUIC'},{id:'t2',direction:'down',file:'产品介绍.pdf',from:'Windows 台式机 / 公共资料',size:18874368,bytes:18874368,speed:0,status:'completed',path:'Relay QUIC'},{id:'t3',direction:'up',file:'交付演示.mp4',from:'本机 → Windows 台式机 / 公共资料',size:650117120,bytes:113246208,speed:7536640,status:'paused',path:'Relay QUIC'}];
const state={tab:'mine',remote:'r1',folder:'a1',subpath:[],search:'',transferFilter:'all',modal:null,editing:null,permShare:null,toast:null};
function getRemote(){return remote.find(r=>r.id===state.remote)||remote[0]};function getFolder(){return getRemote().shares.find(s=>s.id===state.folder)||getRemote().shares[0]};function visibleFiles(){let items=getFolder()?.files||[];for(const sub of state.subpath){const folder=items.find(x=>x.name===sub&&x.type==='folder');items=folder?.items||[]}return items}
function getPermSummary(s){const values=Object.values(s.permissions||{});let r=values.filter(x=>x==='read').length,w=values.filter(x=>x==='rw').length;return `${r+w} 台设备 · 只读 ${r} / 读写 ${w}`}
function badge(text,t='neutral'){return `<span class="badge ${t}">${esc(text)}</span>`};function toast(msg,type='normal'){const el=document.getElementById('toast-root');el.innerHTML=`<div class="toast ${type}">${esc(msg)}</div>`;clearTimeout(window._toastTime);window._toastTime=setTimeout(()=>el.innerHTML='',3200)}
function initNav(){document.getElementById('nav').innerHTML=groupNav.map(([g,items])=>`<div class="nav-group"><div class="group-name">${g}</div>${items.map(([n,i])=>`<button class="nav-item ${n==='文件共享'?'active':''}" data-action="nav" data-name="${n}" title="${n}"><span class="nav-icon">${icon(i)}</span><span>${n}</span></button>`).join('')}</div>`).join('');document.getElementById('settings').querySelector('.nav-icon').innerHTML=icon('settings')}
const tabs=()=>`<div class="tabs" role="tablist">${[['mine','我的共享'],['browse','其他设备'],['transfer','传输任务']].map(([id,n])=>`<button role="tab" aria-selected="${state.tab===id}" data-action="tab" data-value="${id}" class="tab ${state.tab===id?'active':''}">${n}${id==='transfer'?` <span class="count">${transfers.filter(t=>t.status==='active'||t.status==='paused').length}</span>`:''}</button>`).join('')}</div>`;
function metrics(){const active=transfers.filter(x=>x.status==='active');const down=active.filter(x=>x.direction==='down').reduce((a,b)=>a+b.speed,0),up=active.filter(x=>x.direction==='up').reduce((a,b)=>a+b.speed,0);return `<div class="cards-4"><div class="metric"><div class="metric-title">共享文件夹 <span style="color:var(--brand)">${icon('folder')}</span></div><div class="metric-value">${shares.filter(x=>x.enabled).length} <span class="mini">/ ${shares.length}</span></div><div class="metric-note">已启用 / 全部文件夹</div></div><div class="metric"><div class="metric-title">可访问设备 <span style="color:var(--ok)">${icon('device')}</span></div><div class="metric-value">${devices.filter(d=>d.online).length}</div><div class="metric-note">同身份 · 当前在线</div></div><div class="metric"><div class="metric-title">下载速率 <span style="color:var(--brand)">${icon('download')}</span></div><div class="metric-value">${fmt(down)}<span class="mini">/s</span></div><div class="metric-note">所有活跃下载合计</div></div><div class="metric"><div class="metric-title">上传速率 <span style="color:var(--brand2)">${icon('upload')}</span></div><div class="metric-value">${fmt(up)}<span class="mini">/s</span></div><div class="metric-note">所有活跃上传合计</div></div></div>`}
function mine(){const filtered=shares.filter(s=>!state.search||(`${s.name} ${s.path}`).toLowerCase().includes(state.search.toLowerCase()));return `<div class="toolbar"><div><h2>本机共享目录</h2><div class="hint">多目录独立授权，默认不对任何设备开放</div></div><div class="actions"><input class="search" data-change="search" value="${esc(state.search)}" placeholder="搜索共享文件夹或路径"/><button class="btn primary" data-action="add-share">${icon('plus')} 添加共享文件夹</button></div></div><div class="share-list">${filtered.map(s=>`<article class="share-row ${s.enabled?'':'off'}"><div class="share-icon">${icon('folder')}</div><div class="share-detail"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong>${esc(s.name)}</strong>${badge(s.enabled?'共享中':'已停用',s.enabled?'ok':'neutral')}</div><div class="share-path mono">${esc(s.path)}</div><div class="share-meta"><span class="mini">${esc(s.description||'无备注')}</span>${badge(s.files+' 个文件')}${badge(fmt(s.bytes))}${badge(getPermSummary(s),'blue')}</div></div><div class="share-ops"><button class="btn tiny" data-action="permission" data-id="${s.id}">${icon('shield')} 设备权限</button><button class="btn tiny" data-action="edit-share" data-id="${s.id}">${icon('edit')} 编辑</button><button class="btn tiny danger" data-action="delete-share" data-id="${s.id}">${icon('trash')}</button><button class="switch ${s.enabled?'on':''}" role="switch" aria-checked="${s.enabled}" aria-label="切换 ${esc(s.name)}" data-action="toggle-share" data-id="${s.id}"><span></span></button></div></article>`).join('')||'<div class="empty">没有匹配的共享文件夹</div>'}</div><div class="notice gap"><strong>权限生效规则：</strong>每个文件夹按设备单独设置「不允许 / 只读 / 读写」。关闭共享后该目录立即从其他设备列表消失，并终止该共享的未完成传输。演示操作仅影响本页面的模拟数据。</div>`}
function browse(){const r=getRemote(),f=getFolder(),list=visibleFiles().filter(x=>!state.search||x.name.toLowerCase().includes(state.search.toLowerCase()));return `<div class="toolbar"><div><h2>访问已授权设备</h2><div class="hint">仅列出当前身份下、对本设备开放的共享目录</div></div><div class="actions"><button class="btn" data-action="refresh">${icon('refresh')} 刷新</button></div></div><div class="device-list">${remote.map(x=>`<button class="device-tile ${state.remote===x.id?'selected':''}" data-action="remote" data-id="${x.id}"><div class="device-avatar">${icon('device')}</div><div style="flex:1;min-width:0"><strong>${esc(x.name)}</strong><small>${esc(x.shares.length+' 个可访问目录')}</small></div>${badge(x.online?'在线':'离线',x.online?'ok':'neutral')}</button>`).join('')}</div><div class="device-view gap"><section class="card"><div class="card-head"><div><div class="eyebrow">SHARED FOLDERS</div><h2>共享目录</h2></div></div><div class="folder-side">${r.shares.map(s=>`<button data-action="folder" data-id="${s.id}" class="folder-item ${f?.id===s.id?'active':''}"><span style="display:flex;gap:7px;align-items:center">${icon('folder')} ${esc(s.name)}</span>${badge(s.permission==='rw'?'读写':'只读',s.permission==='rw'?'ok':'blue')}</button>`).join('')}</div><div class="notice gap mini">文件访问由共享端 Agent 校验。列表不显示其他设备未授权的目录。</div></section><section class="card"><div class="card-head"><div><div class="eyebrow">REMOTE BROWSER</div><h2>${esc(f?.name||'共享目录')} ${f?badge(f.permission==='rw'?'读写':'只读',f.permission==='rw'?'ok':'blue'):''}</h2></div>${badge(r.online?'设备在线':'设备离线',r.online?'ok':'danger')}</div><div class="toolbar"><div class="crumbs"><button data-action="root">${icon('folder')} ${esc(f?.name||'')}</button>${state.subpath.map((x,i)=>`<span>›</span><button class="${i===state.subpath.length-1?'current':''}" data-action="breadcrumb" data-index="${i}">${esc(x)}</button>`).join('')}</div><div class="actions"><button class="btn tiny" data-action="make-dir" ${!r.online||f.permission!=='rw'?'disabled':''}>${icon('plus')} 新建文件夹</button><button class="btn tiny" data-action="upload-file" ${!r.online||f.permission!=='rw'?'disabled':''}>${icon('upload')} 上传</button></div></div><div class="toolbar"><span class="mini">${list.length} 个项目 · 点击文件下载，文件夹可进入</span><input class="search" style="max-width:230px;min-width:140px" data-change="search" value="${esc(state.search)}" placeholder="搜索当前目录"/></div><div class="table-scroll"><table class="file-table"><thead><tr><th>名称</th><th>大小</th><th>类型</th><th>操作</th></tr></thead><tbody>${!r.online?`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:32px">目标设备离线，无法浏览或传输</td></tr>`:list.map(x=>`<tr><td><div class="file-name"><span class="glyph">${icon(x.type==='folder'?'folder':'file')}</span><button data-action="${x.type==='folder'?'enter':'download'}" data-file="${esc(x.name)}">${esc(x.name)}</button></div></td><td>${x.type==='folder'?'—':fmt(x.size)}</td><td>${x.type==='folder'?'文件夹':'文件'}</td><td><div class="file-ops"><button class="file-action" data-action="${x.type==='folder'?'enter':'download'}" data-file="${esc(x.name)}">${x.type==='folder'?'打开':'下载'}</button>${f.permission==='rw'?`<button class="file-action" data-action="remove-remote" data-file="${esc(x.name)}">删除</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:28px">此目录没有文件</td></tr>'}</tbody></table></div></section></div>`}
function renderTransfer(t){const p=Math.min(100,(t.bytes/t.size||0)*100),rate=t.status==='active'?fmt(t.speed)+'/s':'—',eta=t.status==='active'&&t.speed>0?Math.ceil((t.size-t.bytes)/t.speed)+' 秒':'—';return `<div class="transfer-item"><div class="transfer-top"><span class="glyph">${icon(t.direction==='down'?'download':'upload')}</span><div style="flex:1;min-width:0"><div class="transfer-name">${esc(t.file)} ${badge(t.direction==='down'?'下载':'上传','blue')} ${badge(({active:'传输中',paused:'已暂停',completed:'已完成',canceled:'已取消',error:'传输失败'})[t.status],t.status==='completed'?'ok':t.status==='active'?'blue':t.status==='error'?'danger':'neutral')}</div><div class="transfer-details"><span>${esc(t.from)}</span><span>·</span><span>${esc(t.path)}</span></div></div><div class="transfer-controls">${t.status==='active'?`<button class="btn tiny" data-action="pause" data-id="${t.id}">${icon('pause')} 暂停</button>`:t.status==='paused'?`<button class="btn tiny" data-action="resume" data-id="${t.id}">${icon('play')} 继续</button>`:''}${['active','paused'].includes(t.status)?`<button class="btn tiny danger" data-action="cancel" data-id="${t.id}">${icon('x')} 取消</button>`:''}${t.status==='completed'?`<button class="btn tiny" data-action="locate" data-id="${t.id}">打开位置</button>`:''}</div></div><div class="progress"><div class="progress-fill" style="width:${p.toFixed(1)}%"></div></div><div class="transfer-foot"><span>${fmt(t.bytes)} / ${fmt(t.size)} · ${p.toFixed(1)}%</span><span>${t.status==='active'?`实时 ${rate} · 预计剩余 ${eta}`:t.status==='paused'?'传输暂停，已保留断点':t.status==='completed'?'已完成校验':'传输已停止'}</span></div></div>`}
function transfer(){const list=transfers.filter(t=>state.transferFilter==='all'||(state.transferFilter==='running'?['active','paused'].includes(t.status):t.status==='completed'));return `<div class="toolbar"><div><h2>传输任务</h2><div class="hint">实时查看进度、速率、传输路径与剩余时间；支持暂停、续传、取消</div></div><div class="actions"><div class="filter-pills">${[['all','全部'],['running','进行中'],['completed','已完成']].map(([k,n])=>`<button class="pill ${state.transferFilter===k?'active':''}" data-action="transfer-filter" data-value="${k}">${n}</button>`).join('')}</div><button class="btn tiny" data-action="clear-completed">清除完成记录</button></div></div><div class="transfer-list">${list.map(renderTransfer).join('')||'<div class="empty">没有符合条件的传输任务</div>'}</div><div class="notice gap"><strong>断点续传：</strong>原型按已校验分块模拟任务；正式实现应在下载目标文件的临时文件中持久化分块完成状态，重新连接后复核文件版本并恢复。</div>`}
function render(){const root=document.getElementById('main');const titles={mine:'管理本机共享目录，控制访问设备和读写权限。',browse:'浏览其他设备授权的文件夹并下载、上传文件。',transfer:'查看传输速率、进度与任务状态。'};root.innerHTML=`<div class="page-head"><div><h1>文件共享</h1><p>${titles[state.tab]}</p></div></div>${metrics()}${tabs()}${state.tab==='mine'?mine():state.tab==='browse'?browse():transfer()}`;renderModal()}
function renderModal(){const el=document.getElementById('modal-root');if(!state.modal){el.innerHTML='';return}let title='',body='',footer='',wide=false;const mk=(name,inner,small='')=>`<label class="field"><span>${name}</span>${inner}${small?`<small>${small}</small>`:''}</label>`;const cancel='<button class="btn" data-action="close-modal">取消</button>';
if(state.modal==='add'||state.modal==='edit'){const s=state.editing?shares.find(x=>x.id===state.editing):null;title=s?'编辑共享文件夹':'添加共享文件夹';body=`<div class="form-grid">${mk('共享名称 *',`<input id="share-name" class="control" maxlength="60" value="${esc(s?.name||'')}" placeholder="例如：项目资料"/>`)}${mk('共享状态',`<select class="control" id="share-enabled"><option value="true" ${s?.enabled!==false?'selected':''}>启用</option><option value="false" ${s?.enabled===false?'selected':''}>停用</option></select>`)}<div class="full">${mk('本机文件夹路径 *',`<div class="actions" style="flex-wrap:nowrap"><input id="share-path" class="control mono" value="${esc(s?.path||'')}" placeholder="/Users/... / Windows: D:\\Data"/><button class="btn" data-action="choose-folder">选择文件夹</button></div>`,'正式客户端由 Wails 原生目录选择器或受限本机目录 API 选择；网页原型支持手动填写路径。')}</div><div class="full">${mk('备注',`<input id="share-desc" class="control" value="${esc(s?.description||'')}" placeholder="可选"/>`)}</div></div><div class="notice">新共享默认拒绝所有设备访问，添加后在「设备权限」中显式授权。建议首次仅开放只读。</div>`;footer=`${cancel}<button class="btn primary" data-action="save-share">${s?'保存修改':'添加共享'}</button>`}
if(state.modal==='permission'){const s=shares.find(x=>x.id===state.permShare);title=`设备权限 · ${s.name}`;wide=true;body=`<div class="notice"><strong>${esc(s.name)}</strong> · <span class="mono">${esc(s.path)}</span><div class="mini">权限随共享文件夹单独保存；「读写」包含读取、上传、重命名与删除。</div></div><table class="permission-table gap"><thead><tr><th>设备</th><th>在线状态</th><th style="text-align:right">访问权限</th></tr></thead><tbody>${devices.map(d=>`<tr><td><strong>${esc(d.name)}</strong><div class="mini mono">${esc(d.sub)}</div></td><td>${badge(d.online?'在线':'离线',d.online?'ok':'neutral')}</td><td style="text-align:right"><select class="control perm-select" data-perm-device="${d.id}"><option value="none" ${(s.permissions[d.id]||'none')==='none'?'selected':''}>不允许</option><option value="read" ${s.permissions[d.id]==='read'?'selected':''}>只读</option><option value="rw" ${s.permissions[d.id]==='rw'?'selected':''}>读写</option></select></td></tr>`).join('')}</tbody></table><p class="warning-line">默认拒绝；未审批/跨身份设备不可仅通过本地权限表绕过 Server 授权。写入操作会记录审计。</p>`;footer=`${cancel}<button class="btn primary" data-action="save-permission">保存设备权限</button>`}
if(state.modal==='delete'){const s=shares.find(x=>x.id===state.editing);title='移除共享文件夹';body=`<p>确定移除共享「<strong>${esc(s.name)}</strong>」？</p><div class="notice">只会取消 RelayProxy 对该文件夹的共享，不删除本机真实文件。相关传输任务会停止。</div>`;footer=`${cancel}<button class="btn danger" data-action="confirm-delete">移除共享</button>`}
if(state.modal==='newdir'){title='新建远程文件夹';body=mk('文件夹名称',`<input id="newdir-name" class="control" placeholder="请输入名称"/>`);footer=`${cancel}<button class="btn primary" data-action="confirm-newdir">创建</button>`}
if(state.modal==='remote-delete'){title='删除远程文件';body=`确定删除远程项目「<strong>${esc(state.editing)}</strong>」？<p class="mini">此操作需要共享目录的读写权限，生产实现应在共享端二次校验。</p>`;footer=`${cancel}<button class="btn danger" data-action="confirm-remote-delete">确认删除</button>`}
el.innerHTML=`<div class="overlay" data-action="overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="关闭">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div></div>`}
function makeTransfer(file,kind='down',size=10485760){const r=getRemote(),f=getFolder();const t={id:'t'+(++nextId),direction:kind,file,from:kind==='down'?`${r.name} / ${f.name}`:`本机 → ${r.name} / ${f.name}`,size:Math.max(size,1),bytes:0,speed:kind==='down'?12582912:7340032,status:'active',path:'P2P QUIC'};transfers.unshift(t);state.tab='transfer';state.search='';render();toast(`已创建${kind==='down'?'下载':'上传'}演示任务：${file}`)}
function applyAction(act,d){let s,r,file,folder;switch(act){case 'nav':if(d.name!=='文件共享')toast('此原型只展示「文件共享」模块');break;case 'tab':state.tab=d.value;state.search='';render();break;case 'show-transfers':state.tab='transfer';render();break;case 'theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';break;case 'add-share':state.modal='add';state.editing=null;renderModal();break;case 'edit-share':state.editing=d.id;state.modal='edit';renderModal();break;case 'delete-share':state.editing=d.id;state.modal='delete';renderModal();break;case 'toggle-share':s=shares.find(x=>x.id===d.id);s.enabled=!s.enabled;render();toast(`「${s.name}」已${s.enabled?'启用':'停用'}`);break;case 'permission':state.permShare=d.id;state.modal='permission';renderModal();break;case 'choose-folder':toast('浏览器原型不能调用原生目录选择器；可直接输入本机路径');break;case 'close-modal':state.modal=null;renderModal();break;case 'save-share':{const name=document.getElementById('share-name').value.trim(),path=document.getElementById('share-path').value.trim(),desc=document.getElementById('share-desc').value.trim(),enabled=document.getElementById('share-enabled').value==='true';if(!name||!path){toast('请填写共享名称和路径','warn');return}if(shares.some(x=>x.path===path&&x.id!==state.editing)){toast('该路径已被共享，请检查重复目录','warn');return}if(state.editing){s=shares.find(x=>x.id===state.editing);Object.assign(s,{name,path,description:desc,enabled});}else{shares.unshift({id:'s'+(++nextId),name,path,description:desc,enabled,files:0,bytes:0,permissions:{}})}state.modal=null;render();toast('共享目录配置已更新（原型）');break}case 'save-permission':{s=shares.find(x=>x.id===state.permShare);document.querySelectorAll('[data-perm-device]').forEach(el=>s.permissions[el.dataset.permDevice]=el.value);state.modal=null;render();toast('设备权限已保存（原型）');break}case 'confirm-delete':{const i=shares.findIndex(x=>x.id===state.editing);if(i>=0)shares.splice(i,1);state.modal=null;render();toast('共享已移除，本机文件不会删除');break}case 'remote':state.remote=d.id;state.folder=getRemote().shares[0]?.id;state.subpath=[];state.search='';render();break;case 'folder':state.folder=d.id;state.subpath=[];state.search='';render();break;case 'root':state.subpath=[];state.search='';render();break;case 'breadcrumb':state.subpath=state.subpath.slice(0,Number(d.index)+1);state.search='';render();break;case 'enter':state.subpath.push(d.file);state.search='';render();break;case 'download':file=visibleFiles().find(x=>x.name===d.file);if(file?.type==='file')makeTransfer(file.name,'down',file.size);break;case 'upload-file':document.getElementById('mock-file').click();break;case 'make-dir':state.modal='newdir';renderModal();break;case 'confirm-newdir':{const v=document.getElementById('newdir-name').value.trim();if(!v||v==='.'||v==='..'||/[\\/]/.test(v)){toast('请输入合法的文件夹名称','warn');return}folder=visibleFiles();if(folder.some(x=>x.name===v)){toast('已存在同名文件或文件夹','warn');return}folder.unshift({name:v,type:'folder',items:[]});state.modal=null;render();toast('已创建远程文件夹（原型）');break}case 'remove-remote':state.editing=d.file;state.modal='remote-delete';renderModal();break;case 'confirm-remote-delete':{let arr=visibleFiles(),idx=arr.findIndex(x=>x.name===state.editing);if(idx>=0)arr.splice(idx,1);state.modal=null;render();toast('远程项目已删除（原型）');break}case 'transfer-filter':state.transferFilter=d.value;render();break;case 'clear-completed':for(let i=transfers.length-1;i>=0;i--)if(transfers[i].status==='completed'||transfers[i].status==='canceled')transfers.splice(i,1);render();break;case 'pause':case 'resume':case 'cancel':{const t=transfers.find(x=>x.id===d.id);if(t)t.status=({pause:'paused',resume:'active',cancel:'canceled'})[act];render();break}case 'locate':toast('原型无法打开真实下载目录');break;case 'refresh':toast('已刷新设备列表（示例数据）');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='overlay'&&e.target!==el)return;if(action!=='overlay')applyAction(action,el.dataset);else {state.modal=null;renderModal()}});
document.addEventListener('input',e=>{if(e.target.dataset.change==='search'){const pos=e.target.selectionStart;state.search=e.target.value;const active=state.tab;const root=document.getElementById('main');const text=state.search;render();const input=root.querySelector('[data-change="search"]');if(input&&active===state.tab){input.focus();try{input.setSelectionRange(pos,pos)}catch{}}state.search=text}});
document.getElementById('mock-file').addEventListener('change',e=>{const files=[...e.target.files];if(files.length){for(const f of files)transfers.unshift({id:'t'+(++nextId),direction:'up',file:f.name,from:`本机 → ${getRemote().name} / ${getFolder().name}`,size:Math.max(1,f.size),bytes:0,speed:7340032,status:'active',path:'Relay QUIC'});state.tab='transfer';state.search='';render();toast('创建了 '+files.length+' 个模拟上传任务（不会真实上传）')}e.target.value=''});
setInterval(()=>{let changed=false;for(const t of transfers){if(t.status!=='active')continue;t.speed=Math.max(1200000,Math.round(t.speed*(.86+Math.random()*.27)));t.bytes=Math.min(t.size,t.bytes+t.speed*.48);if(t.bytes>=t.size){t.bytes=t.size;t.status='completed';t.speed=0}changed=true}if(changed&&document.querySelector('.main')){const scroll=document.querySelector('.main').scrollTop;const focus=document.activeElement?.dataset.change;if(!focus){render();document.querySelector('.main').scrollTop=scroll}}},480);
initNav();render();
</script>
</body>
