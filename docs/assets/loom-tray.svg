<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Minimalist 1-bit / monochrome template icon for macOS Menu Bar & Windows System Tray -->
  <!-- Vertical loop: x=9, y=4, w=6, h=18, rx=3 -->
  <rect x="9" y="4" width="6" height="18" rx="3" stroke="currentColor" stroke-width="2"/>

  <!-- Horizontal loop: x=9, y=16, w=16, h=6, rx=3 -->
  <rect x="9" y="16" width="16" height="6" rx="3" stroke="currentColor" stroke-width="2"/>

  <!-- Weave gap / mask (optical break for over-under effect) -->
  <line x1="8" y1="16" x2="16" y2="16" stroke="currentColor" stroke-width="2"/>

  <!-- Peer connection status dot (center) -->
  <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
</svg>
