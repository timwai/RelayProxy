/* Server configuration — curated page geometry and consistent form hierarchy */
.settings-layout{grid-template-columns:224px minmax(0,1fr);gap:22px;align-items:start}

.settings-nav-item span:nth-child(2){min-width:0;display:block;flex:1}
.settings-nav-item b{display:block;font-size:11px;line-height:1.3;font-weight:720}
.settings-nav-item small{display:block;font-size:9px;font-weight:400;color:var(--muted);margin-top:4px;line-height:1.3}

.settings-nav-note{margin:15px 6px 1px;padding:13px 9px 2px;display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);color:var(--subtle);font-size:9px;line-height:1.65}
.settings-nav-note svg{flex:none;margin-top:1px}
.settings-main{min-width:0;max-width:900px;display:flex;flex-direction:column;gap:14px}
.settings-heading{padding:5px 1px 6px;margin:0}

.settings-heading h2{margin:10px 0 6px;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.26}
.settings-heading p{margin:0;font-size:11px;line-height:1.65;color:var(--muted)}
.settings-context{display:flex;align-items:center;gap:7px;align-self:flex-start;margin-top:-6px;font-size:10px;color:var(--muted);padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface3)}
.config-card{background:var(--surface2);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.025);min-width:0}
.config-card-head{display:flex;align-items:center;gap:12px;padding:17px 19px;border-bottom:1px solid var(--line);min-height:76px}
.config-card-icon{display:grid;place-items:center;color:var(--brand);width:37px;height:37px;flex:none;border-radius:11px;background:color-mix(in srgb,var(--brand) 8%,var(--surface3))}
.config-card-heading{flex:1;min-width:0}

.config-card-heading p{font-size:10px;margin:0;color:var(--muted);line-height:1.5}
.config-card-accessory{flex:none;display:flex;align-items:center}

.config-range{display:flex;align-items:center;gap:13px;max-width:600px}
.config-range > label{flex:1;min-width:0}
.config-range .range-dash{font-size:16px;color:var(--subtle);margin-top:19px}
.config-caption{color:var(--muted);font-size:10px;line-height:1.6;margin:10px 0 0}
.config-inline-caption{color:var(--text);font-size:11px;font-weight:730;padding:17px 0 10px;margin-top:18px;border-top:1px solid var(--line)}
.config-permissions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.config-permission{display:flex;align-items:flex-start;gap:10px;padding:15px 12px;min-height:88px;border:1px solid var(--line);background:var(--surface3);border-radius:11px;cursor:pointer}

.config-permission-text{min-width:0}

.config-permission small{font-size:10px;line-height:1.55;display:block;color:var(--muted);margin-top:3px}
.config-help{display:flex;align-items:flex-start;gap:10px;border-radius:11px;border:1px solid var(--line);background:var(--surface3);padding:13px 14px;color:var(--muted);font-size:11px;line-height:1.6}
.config-help-icon{color:var(--brand);flex:none;display:grid;place-items:center;margin-top:1px}
.config-help.warn .config-help-icon{color:var(--warn)}
.config-help b{font-size:11px;color:var(--text)}
.config-help p{margin:2px 0 0;font-size:10px;line-height:1.65}
.config-card-content > .config-help{margin-top:18px}
.config-url{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 11px;border:1px solid var(--line);background:var(--surface3);border-radius:10px}
.config-url-text{display:flex;align-items:center;gap:9px;min-width:0;overflow-wrap:anywhere;color:var(--brand)}
.config-url code{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text)}
.config-url .btn{flex:none}
.config-details{border:1px solid var(--line);border-radius:11px;margin-top:18px;overflow:hidden}
.config-details summary{display:flex;gap:9px;align-items:center;padding:14px;cursor:pointer;background:var(--surface3);font-size:11px;font-weight:720;list-style:none}
.config-details summary::-webkit-details-marker{display:none}
.config-details summary small{color:var(--muted);font-size:10px;font-weight:450;margin-left:auto}
.config-details[open] summary{border-bottom:1px solid var(--line)}
.config-details-content{padding:17px}
.config-field-spacing{margin-top:17px}
.config-cert-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.config-cert-summary > div{padding:14px;border-radius:10px;background:var(--surface3);border:1px solid var(--line)}
.config-cert-summary small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.config-cert-summary strong{display:block;font-size:12px;overflow-wrap:anywhere}
.config-card-actions{display:flex;justify-content:flex-start;margin-top:14px}
.config-card .table-wrap{border-radius:10px}
.config-card .table-wrap table{min-width:650px!important}
.settings-main > .config-help{margin-top:1px}
.settings-restart-note{display:flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--warn) 30%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface2));color:var(--muted);padding:12px 14px;border-radius:12px;margin:0 0 17px;font-size:11px;line-height:1.5}
.settings-restart-note svg{flex:none;color:var(--warn)}
.settings-restart-note b{color:var(--text)}

.settings-save .buttons{gap:7px;align-items:center}
.settings-save .buttons .btn{height:35px}

<div class="grid two-one section-gap"><div class="card hero"><div class="hero-top"><i class="status-dot"></i><div><h2>Relay Server 运行正常</h2><div class="muted">QUIC 传输通道已就绪 · 最后刷新 ${now}</div></div></div><div class="hero-tiles"><div class="hero-tile"><small>TCP / TLS</small><b class="mono">:20800</b></div><div class="hero-tile"><small>QUIC / UDP</small><b class="mono">:20800</b></div><div class="hero-tile"><small>P2P Rendezvous</small><b class="mono">:3479</b></div></div><div style="display:flex;gap:8px;margin-top:17px">${B(`${I('settings')} 服务配置`,'App.go("settings")','sm')}${B(`${I('activity')} 查看连接`,'App.go("sessions")','sm')}</div></div><div class="card">${HD('快捷操作',status('所有系统功能已启用','ok'))}<div class="mini-list">${[['devices','devices','审批设备','处理新设备能力申请'],['identities','users','管理身份授权','修改跨身份 Proxy / RDP 权限'],['channels','message','配置推送渠道','验证码、普通消息与内容分流'],['rdp-audit','shield','检查 RDP 安全','连接审计与来源 IP 聚合'],['settings','settings','服务配置','P2P / Direct / ACL / 证书']].filter(([id])=>isAdmin()||!adminOnly.has(id)).map(([id,ic,t,s])=>`<div class="mini-row" style="cursor:pointer" onclick="App.go('${id}')"><span class="circle-icon">${I(ic)}</span><span class="grow"><b>${t}</b><small>${s}</small></span>${I('chevron',13)}</div>`).join('')}</div></div></div>
<div class="grid g2 section-gap"><div class="card">${HD('最近在线设备',B('全部设备 →','App.go("devices")','sm subtle'))}<div class="mini-list">${ds.slice(0,5).map(d=>`<div class="mini-row"><span class="circle-icon">${I('devices')}</span><span class="grow"><b>${E(d.name)}</b><small>${E(d.system)} · ${E(idName(d.identity))}</small></span><span class="end">${status(d.online?'在线':'离线',d.online?'ok':'')}<small>${d.last}</small></span></div>`).join('')}</div></div><div class="card">${HD('实时传输与审计',B('安全审计 →','App.go("rdp-audit")','sm subtle'))}<div class="detail-list"><div><small>Relay RTT</small><b>15.6 ms</b></div><div><small>平均丢包</small><b>0.0%</b></div><div><small>活跃流</small><b>${ss.reduce((n,s)=>n+s.streams,0)}</b></div><div><small>封禁 IP</small><b>${state.bans.filter(x=>x.kind!=='自动封禁白名单').length}</b></div></div><div class="hr"></div><div class="notice">公网直连由 Server 验证后签发短期 Ticket；P2P 失败自动回退 Relay。RDP 白名单只豁免自动封禁，不绕过设备授权。</div></div></div>`}
function devicePage(){const q=state.deviceQ.toLowerCase();const ds=VD().filter(d=>(!q||[d.name,d.id,d.system,idName(d.identity)].join(' ').toLowerCase().includes(q))&&(!state.deviceRole||d.role===state.deviceRole)&&(!state.deviceStatus||(state.deviceStatus==='migration'?!d.identity:state.deviceStatus==='online'?d.online:state.deviceStatus==='offline'?!d.online:state.deviceStatus==='disabled'?d.disabled:false)));let req=VE().map(x=>`<tr><td><span class="name-primary">${E(x.device)}</span><span class="name-secondary mono">${E(x.id)}</span></td><td>${E(x.system)}</td><td>${x.caps.map(c=>status(caps.find(a=>a[0]===c)?.[1]||c,'blue')).join(' ')}</td><td><span class="name-primary">${E(idName(x.identity))}</span><span class="name-secondary">${x.time}</span></td><td><div class="table-actions">${B('审批','App.enrollment("'+x.id+'")','sm primary')}${B('拒绝','App.rejectEnrollment("'+x.id+'")','sm danger')}</div></td></tr>`).join('');let rows=ds.map(d=>`<tr><td><span class="name-primary">${E(d.name)}</span><span class="name-secondary mono">${E(d.id)}</span></td><td>${E(idName(d.identity))}</td><td><span class="name-primary">${d.role==='BOTH'?'客户端 / 出口':d.role==='EXIT'?'出口节点':'客户端'}</span><span class="name-secondary">${E(d.system)}</span></td><td>${d.disabled?status('已禁用','danger'):!d.identity?status('待迁移','warn'):status(d.online?'在线':'离线',d.online?'ok':'')}</td><td class="mono">${d.tx}</td><td>${d.last}</td><td><div class="table-actions">${B('详情 / 授权','App.device("'+d.id+'")','sm')}${isAdmin()?B('身份归属','App.ownership("'+d.id+'")','sm'):''}</div></td></tr>`).join('');return FH('设备管理','首次连接审核、能力授权、身份归属与历史 RDP 关系迁移。',B(`${I('refresh')} 刷新申请`,'App.refresh()','sm'))+`<div class="card">${HD('待审批设备',status(VE().length+' 台','warn'),'仅能批准申请声明的能力，支持一次勾选多项。')}${T(['设备','系统','申请能力','所属身份 / 申请时间','<span style="float:right">操作</span>'],req,770)}</div><div class="card section-gap">${HD('已登记设备',`<span class="count">共 ${ds.length} 台</span>`)}<div class="toolbar"><input class="input" id="device-filter" value="${E(state.deviceQ)}" placeholder="搜索设备名称、ID 或身份" oninput="App.filter('deviceQ',this.value,'device-filter')"><select onchange="App.filter('deviceStatus',this.value)" aria-label="状态"><option value="">全部状态</option>${[['online','在线'],['offline','离线'],['migration','待迁移'],['disabled','已禁用']].map(o=>`<option ${state.deviceStatus===o[0]?'selected':''} value="${o[0]}">${o[1]}</option>`).join('')}</select><select onchange="App.filter('deviceRole',this.value)" aria-label="角色"><option value="">全部角色</option>${[['CLIENT','客户端'],['EXIT','出口节点'],['BOTH','双角色']].map(o=>`<option ${state.deviceRole===o[0]?'selected':''} value="${o[0]}">${o[1]}</option>`).join('')}</select></div>${T(['设备','身份归属','角色 / 系统','状态','累计传输','最近在线','<span style="float:right">操作</span>'],rows,960)}<p class="muted tiny" style="margin-bottom:0">调整设备能力会断开该设备当前连接；不应将取消某一能力的设备重新放回待审批列表。</p></div>`}
function identitiesPage(){let rows=state.identities.map(x=>`<tr><td><span class="name-primary">${E(x.name)}</span><span class="name-secondary mono">${E(x.id)}</span><span class="name-secondary">登录用户：${E(x.username||'未配置')}</span></td><td>${status(x.active?'启用':'禁用',x.active?'ok':'danger')}</td><td>rev ${x.revision}</td><td>${x.updated}</td><td><div class="table-actions">${B('编辑 / 登录','App.identity("'+x.id+'")','sm')}${B('复制身份 ID','App.copy("'+x.id+'")','sm')}</div></td></tr>`).join('');let grants=state.grants.map(g=>`<tr><td>${E(deviceName(g.target))}<span class="name-secondary mono">${E(g.target)}</span></td><td>${E(idName(g.identity))}</td><td>${g.features.map(x=>status(x==='proxy.use'?'Proxy 出口':'RDP 连接','blue')).join(' ')}</td><td>${E(g.expiry)}</td><td><div class="table-actions">${B('编辑','App.grant("'+g.id+'")','sm')}${B('删除','App.deleteGrant("'+g.id+'")','sm danger')}</div></td></tr>`).join('');return FH('身份与访问授权','身份登录与设备连接 ID 分离，跨身份资源需要显式授权。',B(`${I('plus')} 创建身份`,'App.identity()','primary'),'IDENTITY / ACCESS CONTROL')+`<div class="card">${HD('身份列表',status(state.identities.length+' 个身份','blue'),'管理员可创建、禁用身份，修改名称、登录用户与密码。')}${T(['身份 / ID','状态','策略版本','更新时间','<span style="float:right">操作</span>'],rows,780)}</div><div class="card section-gap">${HD('设备身份授权',B(`${I('plus')} 新增跨身份授权`,'App.grant()','sm primary'),'同身份互通不需要创建授权；跨身份功能按目标设备、被授权身份和能力控制。')}${T(['目标设备','被授权身份','允许的能力','到期时间','<span style="float:right">操作</span>'],grants,820)}<div class="notice" style="margin-top:12px">被授权身份的现有及未来客户端可依据权限访问指定目标设备。支持 Proxy 出口、RDP 连接，修改授权会重新验证在线客户端。</div></div><div class="card section-gap">${HD('系统资源授权',B('前往 Server 出口 →','App.setTab("exit")','sm'),'Server Exit 不归属于任何设备身份，只有被授权身份可在出口清单中看到 server。')}${T(['资源','被授权身份','能力','过期时间','版本'],state.serverGrants.map(g=>`<tr><td><b>server</b><span class="name-secondary">Relay Server</span></td><td>${E(idName(g.identity))}</td><td>${status('Proxy 出口','blue')}</td><td>${g.expiry}</td><td>rev ${g.revision}</td></tr>`).join(''),720)}</div>`}
function exitsPage(){return FH('出口节点','在线 Exit 设备和 Relay Server 的网络出口。实际可见列表受身份授权约束。',B(`${I('refresh')} 刷新`,'App.refresh()','sm'),'EXIT NODES')+`<div class="notice" style="margin-bottom:15px">设备出口同时受 Server Relay ACL 与其本地访问规则限制。Server Exit 的权限由 Server 出口配置及系统身份授权决定。</div><div class="exit-grid">${VX().map(x=>`<div class="exit-card"><div class="exit-head"><span class="exit-symbol">${x.country}</span><div class="grow"><h3>${E(x.name)}</h3><p class="mono">${E(x.id)}</p></div>${status(x.online?'在线':'离线',x.online?'ok':'')}</div><div class="exit-props"><div><small>网络地址</small><b class="mono">${x.addr}</b></div><div><small>路径</small><b>${E(x.path)}</b></div><div><small>Relay RTT</small><b>${x.rtt?x.rtt+' ms':'本机'}</b></div><div><small>归属</small><b>${E(idName(x.identity)==='未分配'?x.identity:idName(x.identity))}</b></div></div><div class="hr"></div>${B(x.id==='server'?'配置 Server 出口':'查看设备详情',x.id==='server'?'App.setTab("exit")':'App.device("'+x.id+'")','sm')}</div>`).join('')}</div>`}
function sessionsPage(){let rows=VS().map((s,i)=>`<tr><td><b>${s.device}</b><div class="name-secondary mono">session-00${i+1}</div></td><td>${s.role}</td><td>${s.exit}</td><td>${status(s.transport,'blue')}</td><td>${s.streams}</td><td class="mono">${s.up} / ${s.down}</td><td><small>${s.diag}</small></td></tr>`).join('');return FH('实时连接','设备级实时会话、传输路径与诊断；传输量为本次会话累计。',B(`${I('activity')} 采集 30 秒诊断`,'App.capture()','primary'),'LIVE SESSIONS')+(state.diagnostics?`<div class="notice" style="margin-bottom:14px">诊断示例已采集：当前会话活跃流共 ${VS().reduce((a,b)=>a+b.streams,0)}，平均 RTT 17 ms，Relay 丢包约 0%。${B('查看采集结果','App.diagnosticDetail()','sm')}</div>`:'')+`<div class="grid g3"><div class="card metric"><div class="metric-label">活跃设备会话${I('devices')}</div><div class="metric-value">${VS().length}</div><small>活跃中的会话</small></div><div class="card metric"><div class="metric-label">并发流${I('activity')}</div><div class="metric-value">${VS().reduce((a,b)=>a+b.streams,0)}</div><small>全网累计</small></div><div class="card metric"><div class="metric-label">直连路径${I('route')}</div><div class="metric-value">${VP().filter(x=>x.status==='DIRECT'||x.status==='AVAILABLE').length}</div><small>Public Direct / P2P</small></div></div><div class="card section-gap">${HD('设备连接详情',status('实时更新','ok'))}${T(['设备','角色','选定出口','传输类型','活跃流','上传 / 下载','连接诊断'],rows,870)}</div><div class="card section-gap">${HD('P2P Direct Path',B('查看全部路径 →','App.go("p2p")','sm subtle'))}${p2pTable()}</div>`}
function p2pTable(){return T(['Client → Exit','状态','Client 路径','Exit 路径','租约到期','RTT'],VP().map(x=>`<tr><td><b>${x.client}</b><div class="name-secondary">→ ${x.exit}</div></td><td>${status(x.status,x.status==='FALLBACK'?'warn':'ok')}</td><td>${x.clientPath}</td><td>${x.exitPath}</td><td>${x.lease}</td><td>${x.rtt?x.rtt+' ms':'—'}</td></tr>`).join(''),780)}
function p2pPage(){return FH('P2P / Direct 路径','展示脱敏的打洞状态、Direct Path、租约和自动回退路径。',B(`${I('settings')} P2P 参数`,'App.setTab("p2p")','sm'),'P2P DIRECT PATH')+`<div class="grid g3"><div class="card metric"><div class="metric-label">直连路径${I('network')}</div><div class="metric-value">2</div><small>AVAILABLE / DIRECT</small></div><div class="card metric"><div class="metric-label">Relay 回退${I('route')}</div><div class="metric-value">1</div><small>传输自动恢复</small></div><div class="card metric"><div class="metric-label">UPnP 自动映射${I('globe')}</div><div class="metric-value" style="font-size:20px">已开启</div><small>取决于 Agent 所在路由器支持情况</small></div></div><div class="card section-gap">${HD('路径报告与租约',B('刷新路径','App.refresh()','sm'))}${p2pTable()}</div><div class="notice" style="margin-top:14px">当某一端仅有 IPv4 时，应选择双方均可到达的候选地址；IPv6 不可达应避免持续尝试。UPnP 映射结果需要以路由器实测状态为准。本页面仅展示 Server 已收到的路径报告。</div>`}
function messagesPage(){const q=state.msgQ.toLowerCase(),arr=VM().filter(m=>(!state.msgType||m.type===state.msgType)&&(!state.msgStatus||m.status===state.msgStatus)&&(!state.msgChannel||m.channel===state.msgChannel)&&(!q||[m.title,m.content,m.source,m.targets,m.code].join(' ').toLowerCase().includes(q)));let rows=arr.map(m=>`<tr><td><b>${m.time}</b><span class="name-secondary">${E(m.source)} · ${m.channel}</span></td><td><span class="name-primary">${E(m.title)}</span><span class="name-secondary" style="max-width:230px;white-space:normal">${E(m.content)}</span></td><td>${m.code?`<b class="mono" style="font-size:14px;letter-spacing:2px">${m.code}</b>`:'—'}<div class="name-secondary">${({verification_code:'验证码',message:'普通消息',important:'重要提醒',unmatched:'未匹配规则'})[m.type]}</div></td><td><span class="name-primary">${m.targets}</span>${status(({delivered:'已送达',offline:'设备离线',failed:'投递失败',pending:'等待投递'})[m.status],({delivered:'ok',offline:'warn',failed:'danger',pending:'blue'})[m.status])}</td><td><div class="table-actions">${B('详情','App.message('+m.id+')','sm')}${isAdmin()?B('删除','App.deleteMessage('+m.id+')','sm danger'):''}</div></td></tr>`).join('');return FH('消息历史','查看投递记录、验证码提取结果、目标设备与投递状态。',(isAdmin()?B('清空全部消息','App.clearMessages()','danger'):'')+B(`${I('refresh')} 刷新`,'App.refresh()','sm'),'MESSAGE CENTER')+`<div class="card">${HD('消息记录',status(arr.length+' 条','blue'))}<div class="toolbar"><input class="input" value="${E(state.msgQ)}" id="msg-filter" placeholder="搜索标题、内容、来源、设备或验证码" oninput="App.filter('msgQ',this.value,'msg-filter')"><select onchange="App.filter('msgType',this.value)"><option value="">全部类型</option>${[['verification_code','验证码'],['message','普通消息'],['important','重要提醒'],['unmatched','未匹配规则']].map(o=>`<option ${state.msgType===o[0]?'selected':''} value="${o[0]}">${o[1]}</option>`).join('')}</select><select onchange="App.filter('msgStatus',this.value)"><option value="">全部状态</option>${[['delivered','已送达'],['offline','设备离线'],['failed','投递失败'],['pending' function settingsPage(){
  const navGroups=[{name:'基础服务',ids:['admin','tunnel']},{name:'网络能力',ids:['direct','p2p','exit']},{name:'安全与访问',ids:['rdp','certificate','acl']}];
  const descriptions={admin:'控制台与 HTTPS',tunnel:'TCP / QUIC / TLS',direct:'公网 QUIC 端点',p2p:'Rendezvous · UPnP',rdp:'入口与来源限制',exit:'出口网络及授权',certificate:'PEM 与有效期',acl:'域名与 IP 权限'};
  const dirty=state.settingsDirty;
  const navigation=navGroups.map(group=>`<div class="settings-nav-group"><div class="settings-nav-label">${group.name}</div>${group.ids.map(id=>{const tab=settingTabs.find(t=>t[0]===id);return `<button type="button" class="settings-nav-item ${state.settingTab===id?'active':''}" ${state.settingTab===id?'aria-current="page"':''} onclick="App.setTab('${id}')"><span class="settings-nav-icon">${I(tab[2],17)}</span><span><b>${tab[1]}</b><small>${descriptions[id]}</small></span>${state.settingTab===id?`<span class="settings-nav-selected"></span>`:''}</button>`}).join('')}</div>`).join('');
  return FH('服务配置','按服务模块管理监听、安全与网络功能，修改仅在本演示环境中生效。',state.restart?status('部分设置等待重启','warn'):status('演示配置已加载','ok'),'SYSTEM / CONFIGURATION')+
    (state.restart?`<div class="settings-restart-note">${I('info',17)} <span><b>配置已保存（演示）</b>　部分监听、证书和端口范围设置需重启实际 Server 才会生效。</span></div>`:'')+
    `<div class="settings-layout"><aside class="settings-sidebar" aria-label="服务配置分类">${navigation}<div class="settings-nav-note">${I('shield',15)} <span>配置的可用性受服务端权限与授权规则共同约束。</span></div></aside><div class="settings-main">${settingsSection()}<div class="settings-save ${dirty?'dirty':''}" id="settings-save"><div class="settings-save-indicator">${I(dirty?'info':'check',19)}</div><div class="grow"><b>${dirty?'有未保存的配置修改':'所有配置已保存'}</b><small>${dirty?'请保存或放弃本次改动':'演示配置 · server.yaml'} · 部分配置需重启</small></div><div class="buttons"><button type="button" class="btn sm" id="settings-discard-btn" onclick="App.discardSettings()" ${dirty?'':'disabled'}>放弃修改</button><button type="button" class="btn primary" id="settings-commit-btn" onclick="App.saveSettings()" ${dirty?'':'disabled'}>${I('check',15)} 保存配置</button></div></div></div></div>`;
}
function toast(message){const host=inp('toast-area'),node=document.createElement('div');node.className='toast';node.textContent=message;host.appendChild(node);setTimeout(()=>node.remove(),3700)}
function openModal(title,desc,body,saveLabel='保存',onSave=null,opt={}){state.modalSave=onSave;state.modalCancel=opt.onCancel||null;inp('modal-title').textContent=title;inp('modal-desc').textContent=desc||'';inp('modal-body').innerHTML=body;inp('modal').classList.toggle('wide',!!opt.wide);inp('modal-footer').innerHTML=`${opt.extra||''}<button class="btn sm" onclick="App.closeModal()">取消</button>${onSave?`<button class="btn primary sm" onclick="App.saveModal()">${E(saveLabel)}</button>`:''}`;inp('modal-overlay').classList.add('open');document.body.style.overflow='hidden';inp('modal-body').scrollTop=0;}
function closeModal(){inp('modal-overlay').classList.remove('open');state.modalSave=null;document.body.style.overflow='';}
function confirmModal(title,desc,callback,word='确认执行'){openModal(title,desc,`<div class="notice warn">此操作仅更改原型中的演示数据。真实环境应由后端再次确认权限和请求。</div>`,word,()=>{callback();closeModal();render()});}
function optDevices(selected='',filterFn=()=>true){return `<option value="">请选择设备</option>`+state.devices.filter(filterFn).map(x=>`<option ${x.id===selected?'selected':''} value="${E(x.id)}">${E(x.name)} · ${E(idName(x.identity))}</option>`).join('')}
function optIdentities(selected=''){return `<option value="">请选择身份</option>`+state.identities.map(x=>`<option ${x.id===selected?'selected':''} value="${x.id}">${E(x.name)} · ${E(x.id)}</option>`).join('')}
function deviceModal(id,tab='info'){const d=state.devices.find(x=>x.id===id);if(!d)return;state.deviceModalTab=tab;let body=`<div class="tabline">${[['info','设备详情'],['cap','授权能力'],['grants','跨身份授权'],['rdp','历史 RDP 关系']].map(o=>`<button onclick="App.device('${id}','${o[0]}')" class="${tab===o[0]?'active':''}">${o[1]}</button>`).join('')}</div>`;if(tab==='info'){body+=`<div class="detail-list">${[['设备名称',d.name],['设备 ID',d.id],['所属身份',idName(d.identity)],['操作系统',d.system],['设备角色',d.role],['在线状态',d.online?'在线':'离线'],['累计传输',d.tx],['最近在线',d.last]].map(([k,x])=>`<div><small>${k}</small><b>${E(x)}</b></div>`).join('')}</div><div class="notice" style="margin-top:12px">更改身份归属会断开当前连接，客户端需要使用新身份 ID；跨身份授权也将按新归属重新核对。</div><div style="display:flex;gap:8px;margin-top:15px">${B('设置身份归属',`App.ownership('${id}')`,'sm')}${B('复制设备 ID',`App.copy('${id}')`,'sm')}${B('撤销授权',`App.revokeDevice('${id}')`,'sm danger')}${B('删除设备',`App.deleteDevice('${id}')`,'sm danger')}</div>`}
if(tab==='cap'){body+=`<p class="muted tiny">修改后会断开当前设备会话，至少保留一项能力；全部停用请使用撤销设备授权。</p><div class="check-grid">${caps.map(([id,n,ds])=>cbox('cap-'+id,n,d.caps.includes(id),ds)).join('')}</div>`}
if(tab==='grants'){const grants=state.grants.filter(g=>g.target===id);body+=`<div class="notice" style="margin-bottom:12px">同身份设备的隐式访问无需重复配置。跨身份 Proxy 出口 / RDP 连接按身份、功能、到期时间控制。</div>${T(['被授权身份','权限','到期','操作'],grants.map(g=>`<tr><td>${idName(g.identity)}</td><td>${g.features.map(f=>f==='proxy.use'?'Proxy 出口':'RDP 连接').join('、')}</td><td>${g.expiry}</td><td>${B('编辑',`App.grant('${g.id}')`,'sm')}</td></tr>`).join(''),640)}<div style="margin-top:12px">${B('为设备新增授权',`App.grant('', '${id}')`,'sm primary')}</div>`}
if(tab==='rdp'){body+=`<div class="notice warn">升级前的设备对设备 RDP 关系仅供迁移参考，不再授予生产连接。请在「跨身份授权」中对访问方身份勾选 RDP 连接。</div><div class="check-grid form-block">${state.devices.filter(x=>x.id!==id&&x.caps.includes('rdp.host')).map(x=>cbox('legacy-'+x.id,x.name,(state.legacyRdp[id]||[]).includes(x.id),'仅保留历史配置')).join('')}</div>`}
openModal(`设备 · ${d.name}`,'查看设备信息与能力，并通过 Server 管理身份隔离。',body,tab==='cap'?'保存设备授权':tab==='rdp'?'保存历史关系':'',tab==='rdp'?()=>{state.legacyRdp[id]=state.devices.filter(x=>x.id!==id&&x.caps.includes('rdp.host')&&checked('legacy-'+x.id)).map(x=>x.id);closeModal();render();toast('历史 RDP 关系已保存（不授予生产连接）')}:tab==='cap'?()=>{const chosen=caps.filter(([k])=>checked('cap-'+k)).map(x=>x[0]);if(!chosen.length){toast('至少保留一个授权能力');return}d.caps=chosen;toast('设备能力已更新（演示）；真实环境将使设备重新连接');closeModal();render()}:null,{wide:tab==='grants'||tab==='rdp'});}
function ownership(id){const d=state.devices.find(x=>x.id===id);if(!d)return;openModal('更改设备身份归属',`设备：${d.name} · ${d.id}`,`<div class="form-block">${select('新的所属身份','ownership-identity',state.identities.map(x=>[x.id,x.name+' · '+x.id]),d.identity,'修改后原有目标跨身份授权将删除。')}</div><div class="notice warn" style="margin-top:13px">切换身份会使设备断线，需要将 Agent 的身份 ID 同步修改。原有的跨身份授权不应跨归属保留。</div>`,'保存身份归属',()=>{const identity=v('ownership-identity');if(!identity){toast('请选择身份');return}d.identity=identity;state.grants=state.grants.filter(g=>g.target!==id);toast('身份归属已更新（演示）');closeModal();render()})}
function revokeDevice(id){confirmModal('撤销设备授权',`设备 ${deviceName(id)} 将失去所有批准能力并断开连接。`,()=>{const d=state.devices.find(x=>x.id===id);if(d){d.disabled=true;d.online=false;}toast('设备授权已撤销')},'撤销授权')}
function deleteDevice(id){confirmModal('删除设备',`永久删除 ${deviceName(id)} 的登记信息，并清除以它为目标的跨身份授权。`,()=>{state.devices=state.devices.filter(x=>x.id!==id);state.grants=state.grants.filter(x=>x.target!==id);toast('设备已从演示列表删除')},'删除设备')}
function enrollment(id){const x=state.enrollments.find(a=>a.id===id);if(!x)return;openModal('审批设备申请',`新接入设备 ${x.device} · ${x.system} · ${idName(x.identity)}`,`<div class="check-grid">${x.caps.map(k=>{const c=caps.find(a=>a[0]===k);return cbox('req-'+k,c?.[1]||k,true,c?.[2]||'')}).join('')}</div><div class="notice" style="margin-top:15px">只允许批准本次申请声明的能力。取消某一已批准能力不应触发再次进入审批队列。</div>`,'批准选中能力',()=>{const selected=x.caps.filter(k=>checked('req-'+k));if(!selected.length){toast('至少选择一个能力');return}state.devices.push({id:'dev-'+x.id,name:x.device,identity:x.identity,system:x.system,role:selected.includes('proxy.client')?'CLIENT':'EXIT',online:false,caps:selected,tx:'0 B',last:'刚刚',rtt:null});state.enrollments=state.enrollments.filter(a=>a.id!==id);closeModal();render();toast('已批准设备申请（演示）')},{extra:B('拒绝申请',`App.rejectEnrollment('${id}')`,'sm danger push-left')})}
function rejectEnrollment(id){confirmModal('拒绝设备申请','拒绝后不授权此次声明的任何能力。',()=>{state.enrollments=state.enrollments.filter(x=>x.id!==id);toast('已拒绝申请')},'拒绝申请')}
function identityModal(id){const orig=state.identities.find(x=>x.id===id),isEdit=!!orig;openModal(isEdit?'编辑身份与独立登录':'创建新身份','设备连接使用 16 位身份 ID；Web 登录用户名与其独立配置。',`<div class="form-grid">${field('身份名称','id-name',orig?.name||'','用于管理界面识别')}${select('身份状态','id-active',[['true','启用'],['false','禁用']],String(orig?.active??true))}</div><div class="form-grid form-block">${field('登录用户名','id-user',orig?.username||'','与身份 ID 分离')}${field(isEdit?'重置登录密码（可留空）':'初始登录密码','id-password','','至少 8 个字符','password')}</div>${orig?`<div class="detail-list form-block"><div><small>身份 ID</small><b class="mono">${orig.id}</b></div><div><small>策略版本</small><b>rev ${orig.revision}</b></div></div>`:''}<div class="notice warn" style="margin-top:14px">禁用身份将使该身份设备会话和独立登录失效。更新登录用户名或密码会注销该身份的现有管理会话。</div>`,'保存身份',()=>{const name=v('id-name').trim(),username=v('id-user').trim(),password=v('id-password');if(!name||!username){toast('请填写身份名称和登录用户名');return}if(!isEdit&&password.length<8){toast('初始密码至少 8 个字符');return}if(password&&password.length<8){toast('新密码至少 8 个字符');return}if(isEdit){orig.name=name;orig.username=username;orig.active=checked('id-active')?true:v('id-active')==='true';orig.revision++;orig.updated=now}else{state.identities.push({id:'f'+String(Math.random()).slice(2,17).padEnd(15,'0').slice(0,15),name,username,active:v('id-active')==='true',revision:1,updated:now})}closeModal();render();toast('身份配置已保存（演示）')})}
function grantModal(id,target=''){const orig=state.grants.find(g=>g.id===id);openModal(orig?'编辑跨身份授权':'新增跨身份授权','按目标设备 → 被授权身份分配 Proxy / RDP 访问权限。',`<div class="form-grid">${select('目标设备','grant-target',state.devices.filter(d=>d.identity).map(d=>[d.id,d.name+' · '+idName(d.identity)]),orig?.target||target)}${select('被授权身份','grant-id',state.identities.map(i=>[i.id,i.name]),orig?.identity||'')}</div><div class="form-block"><span class="strong tiny">功能授权（至少选一项）</span><div class="check-grid" style="margin-top:7px">${cbox('grant-proxy','Proxy 出口',orig?.features.includes('proxy.use')||false)}${cbox('grant-rdp','RDP 连接',orig?.features.includes('rdp.connect')||false)}</div></div><div class="form-grid form-block">${field('过期时间（可选）','grant-expiry',orig?.expiry==='永不过期'?'':orig?.expiry.replace(' ','T')||'','留空表示永不过期','datetime-local')}${field('修订版本','grant-revision',orig?.revision||1,'','text','readonly')}</div><div class="notice" style="margin-top:12px">相同身份隐式访问，无需创建授权；到期后不再下发访问权限。</div>`,'保存授权',()=>{const target=v('grant-target'),identity=v('grant-id'),features=[...(checked('grant-proxy')?['proxy.use']:[]),...(checked('grant-rdp')?['rdp.connect']:[])];if(!target||!identity||!features.length){toast('请完整选择目标、身份和至少一项功能');return}if(state.devices.find(d=>d.id===target)?.identity===identity){toast('同身份互通无需配置跨身份授权');return}const entry={id:orig?.id||'grant-'+Date.now(),target,identity,features,expiry:v('grant-expiry')?v('grant-expiry').replace('T',' '):'永不过期',revision:(orig?.revision||0)+1};if(orig)Object.assign(orig,entry);else state.grants.push(entry);closeModal();render();toast('跨身份授权已保存（演示）')})}
function deleteGrant(id){confirmModal('删除跨身份授权','删除后被授权身份不再能跨身份访问此设备。',()=>{state.grants=state.grants.filter(g=>g.id!==id);toast('跨身份授权已删除')},'删除授权')}
function serverGrantModal(id){const orig=state.serverGrants.find(g=>g.id===id);openModal(orig?'编辑 Server Exit 授权':'授权身份使用 Server Exit','系统资源 server 与设备身份归属分离。',`${select('被授权身份','sg-identity',state.identities.map(i=>[i.id,i.name]),orig?.identity||'')}<div class="form-block">${field('到期时间（可选）','sg-expiry',orig?.expiry==='永不过期'?'':orig?.expiry.replace(' ','T')||'','留空为永不过期','datetime-local')}</div><div class="notice" style="margin-top:12px">授权后，身份下具有代理客户端能力的设备才能看到并使用 server 出口。</div>`,'保存系统授权',()=>{const identity=v('sg-identity');if(!identity){toast('请选择身份');return}if(state.serverGrants.some(g=>g.identity===identity&&g.id!==id)){toast('此身份已拥有授权');return}const entry={id:orig?.id||'sg-'+Date.now(),identity,expiry:v('sg-expiry')?v('sg-expiry').replace('T',' '):'永不过期',revision:(orig?.revision||0)+1};if(orig)Object.assign(orig,entry);else state.serverGrants.push(entry);closeModal();render();toast('系统资源身份授权已更新')})}
function deleteServerGrant(id){confirmModal('撤销 Server Exit 授权','该身份将无法再获得服务端出口 server。',()=>{state.serverGrants=state.serverGrants.filter(g=>g.id!==id);toast('授权已撤销')},'撤销系统授权')}
function messageModal(id){const m=state.messages.find(x=>x.id===id);if(!m)return;openModal('消息详情 · '+m.title,'仅展示消息记录和设备投递状态。',`<div class="detail-list">${[['推送渠道',m.channel],['来源',m.source],['消息类型',m.type],['时间',m.time],['目标设备',m.targets],['投递结果',m.status]].map(([k,value])=>`<div><small>${k}</small><b>${E(value)}</b></div>`).join('')}</div><div class="card form-block" style="box-shadow:none"><b>消息正文</b><p style="white-space:pre-wrap">${E(m.content)}</p>${m.code?`<div class="preview-code">${E(m.code)}</div>`:''}</div>`,null,null,{extra:isAdmin()?B('删除消息','App.deleteMessage('+id+')','sm danger push-left'):''})}
function deleteMessage(id){if(!isAdmin()){toast('仅全局管理员可删除消息记录');return}confirmModal('删除消息','删除此条消息记录，不会改变渠道规则和目标设备。',()=>{state.messages=state.messages.filter(x=>x.id!==id);toast('已删除消息')},'删除消息')}
function clearMessages(channelOnly=false){if(!isAdmin()){toast('仅全局管理员可清理消息历史');return}let ch=state.msgChannel;confirmModal(channelOnly?'清空渠道消息':'清空全部消息',channelOnly?`清除渠道 ${ch} 的所有历史消息。`:'删除所有渠道的消息历史。',()=>{state.messages=channelOnly?state.messages.filter(m=>m.channel!==ch):[];toast('消息记录已清空')},'确认清空')}
function capture(){state.diagnostics=true;render();toast('已生成 30 秒诊断的交互示例')}
function diagnosticDetail(){openModal('会话诊断结果','30 秒诊断样例 · 不连接真实诊断接口。',`<div class="detail-list"><div><small>采集窗口</small><b>30 秒</b></div><div><small>活跃流</small><b>53</b></div><div><small>Relay RTT</small><b>15.6 ms</b></div><div><small>丢包</small><b>0.0%</b></div></div><div class="code-panel form-block">[10:52:01] diagnostic capture started\n[10:52:08] relay QUIC available · RTT 15.6 ms\n[10:52:11] public direct candidate verified\n[10:52:22] P2P lease active · 2 paths\n[10:52:31] diagnostic capture completed</div>`,null,null,{extra:B('复制诊断结果','App.copy("Relay RTT 15.6 ms; loss 0%; 53 streams")','sm push-left')})}
function newIngress(){openModal('创建 RDP 公网入口','为已具备 rdp.public 能力的目标设备配置受控的 TCP / UDP 端口。',`<div class="form-grid g3">${select('目标设备','ingress-target',state.devices.filter(d=>d.caps.includes('rdp.public')).map(d=>[d.id,d.name]))}${field('固定端口（可留空）','ingress-port','','留空自动分配','number','min="1" max="65535"')}${field('每来源 IP 每分钟上限','ingress-rate',120,'1–100000','number','min="1" max="100000"')}</div><div class="form-grid form-block">${textarea('来源 CIDR（每行一条）','ingress-cidr','203.0.113.0/24','留空允许所有 IPv4 / IPv6 来源')}${field('过期时间（可选）','ingress-expiry','','到期后拒绝新连接','datetime-local')}</div><div class="notice warn" style="margin-top:13px">只有全局 RDP 公网入口已启用且目标设备获 rdp.public 授权时才能生效。</div>`,'创建受控入口',()=>{const target=v('ingress-target');if(!target){toast('请选择目标设备');return}let port=Number(v('ingress-port'))||22480+state.ingress.length;if(port<1||port>65535){toast('端口范围无效');return}if(state.ingress.some(x=>x.port===port)){toast('端口已被分配');return}state.ingress.push({id:'rdp-'+Date.now(),target,port,cidr:v('ingress-cidr').trim()||'全部来源',rate:Number(v('ingress-rate'))||120,expiry:v('ingress-expiry')||'无',tcp:'在线',udp:'关联可用',enabled:true});closeModal();render();toast('RDP 公网入口已创建（演示）')})}
function toggleIngress(id){const r=state.ingress.find(x=>x.id===id);if(r){r.enabled=!r.enabled;render();toast('入口状态已变更（演示）')}}
function deleteIngress(id){confirmModal('删除公网 RDP 入口','该 TCP / UDP 公网端口将不再为设备提供转发。',()=>{state.ingress=state.ingress.filter(x=>x.id!==id);toast('入口已删除')},'删除入口')}
function auditDetails(ip,page=1){const x=state.rdpLogs.find(x=>x.ip===ip);if(!x)return;const size=8,pages=Math.min(10,Math.ceil(x.conn/size)),p=Math.max(1,Math.min(page,pages));let arr=Array.from({length:Math.min(size,x.conn-(p-1)*size)},(_,i)=>{const k=(p-1)*size+i;return {time:`10:${String(37-(k%32)).padStart(2,'0')}:${String((18+k*7)%60).padStart(2,'0')}`,target:x.targets[k%x.targets.length],status:k%x.conn<x.denied?'拒绝':'已连接',protocol:k%4===0?'UDP':'TCP',traffic:k%5===0?'0 B':(2+k*3)+' KiB'}});openModal('RDP 来源明细 · '+ip,`来源聚合：连接 ${x.conn} 次 / 拒绝 ${x.denied} 次，按最近时间倒序。`,T(['时间','目标设备','协议','状态','流量'],arr.map(a=>`<tr><td class="mono">${a.time}</td><td>${E(a.target)}</td><td>${a.protocol}</td><td>${status(a.status,a.status==='拒绝'?'danger':'ok')}</td><td>${a.traffic}</td></tr>`).join(''),640)+`<div class="pagination">${B('上一页',`App.auditDetails('${ip}',${p-1})`,'sm')}<span>第 ${p} / ${pages} 页</span>${B('下一页',`App.auditDetails('${ip}',${p+1})`,'sm')}</div>`,null,null,{wide:true,extra:B('手动封禁此 IP',`App.newBan('${ip}')`,'sm danger push-left')})}
function clearAudit(){confirmModal('清除 RDP 连接记录','仅清除连接历史和按来源 IP 聚合数据，不删除封禁、白名单和自动封禁规则。',()=>{state.rdpLogs=[];state.auditPage=1;toast('连接审计历史已清空')},'清除全部连接记录')}
function newBan(ip=''){openModal('新增 IP 黑名单 / 白名单','支持 IPv4、IPv6、CIDR，允许设置目标入口、生效时间及原因。',`<div class="form-grid g3">${field('IP 或 CIDR','ban-cidr',ip,'例如 203.0.113.24 / 2001:db8::1')}${select('策略','ban-kind',[['手动封禁','手动封禁'],['自动封禁白名单','自动封禁白名单']])}${select('生效范围','ban-scope',[['全局','全部公网 RDP 入口'],...state.ingress.map(i=>[String(i.port),deviceName(i.target)+':'+i.port])])}</div><div class="form-grid form-block">${select('有效期','ban-duration',[['15 分钟','15 分钟'],['1 小时','1 小时'],['24 小时','24 小时'],['7 天','7 天'],['永久','永久']])}${field('原因','ban-reason','','手动封禁原因或白名单备注')}</div><div class="notice" style="margin-top:13px">白名单只豁免自动封禁；不能绕过手动封禁、入口来源 CIDR 和设备能力授权。</div>`,'保存 IP 策略',()=>{const cidr=v('ban-cidr').trim();if(!cidr||!(/^[0-9a-f:.]+(\/\d+)?$/i.test(cidr))){toast('请输入有效 IPv4、IPv6 或 CIDR 格式');return}state.bans.push({id:'ban-'+Date.now(),cidr,kind:v('ban-kind'),scope:v('ban-scope'),reason:v('ban-reason')||'手动配置',expiry:v('ban-duration')});closeModal();render();toast('IP 策略已保存（演示）')})}
function deleteBan(id){const b=state.bans.find(x=>x.id===id);confirmModal(b?.kind==='自动封禁白名单'?'移除自动封禁白名单':'解封来源 IP',`策略 ${b?.cidr||id} 将从安全列表中移除。`,()=>{state.bans=state.bans.filter(x=>x.id!==id);toast('安全策略已删除')},'确认移除')}
function editRule(id){const r=state.rdpRules.find(x=>x.id===id);if(!r)return;openModal('编辑自动封禁规则',`规则 ${r.name} · 仅统计新建 TCP 连接，触发后阻止后续新连接。`,`${field('规则名称','auto-name',r.name)}<div class="form-grid g3 form-block">${field('统计窗口（秒）','auto-window',r.window,'','number')}${field('连接阈值（次）','auto-threshold',r.threshold,'','number')}${field('封禁时长（秒）','auto-ban',r.ban,'','number')}</div><div class="form-block">${togg('auto-enabled','启用该规则',r.enabled,'与入口每来源 IP 限速同时生效')}</div>`,'保存规则',()=>{const name=v('auto-name').trim(),windowSec=Number(v('auto-window')),threshold=Number(v('auto-threshold')),ban=Number(v('auto-ban'));if(!name||windowSec<1||threshold<1||ban<1){toast('请填写有效的规则参数');return}Object.assign(r,{name,window:windowSec,threshold,ban,enabled:checked('auto-enabled')});closeModal();render();toast('自动封禁规则已保存')})}
function channelRuleCard(rule,index){const t=rule.type||'message',mt=rule.matchType||'keywords',extractor=rule.extractor||'auto';return `<div class="rule-card" data-chan-rule="${index}"><div class="rule-top"><div><b>↕ ${rule.default?'默认验证码规则（始终末尾）':'消息规则 '+(index+1)}</b><small>按顺序匹配，首条命中决定消息类型与弹窗行为</small></div><div class="actions">${B('↑',`App.moveRule(${index},-1)`,'xs')}${B('↓',`App.moveRule(${index},1)`,'xs')}${rule.default?'':B('删除',`App.removeRule(${index})`,'xs danger')}</div></div><div class="form-grid form-block">${field('规则名称','cr-name-'+index,rule.name||'')}${select('消息类型','cr-type-'+index,[['verification_code','验证码'],['message','普通消息'],['important','重要提醒'],['unmatched','未匹配规则']],t)}</div><div class="form-grid form-block">${select('匹配方式','cr-mode-'+index,[['keywords','关键词匹配'],['regex','正则表达式'],['auto','自动识别']],mt)}${select('关键词逻辑','cr-logic-'+index,[['any','任意词命中'],['all','全部词命中']],rule.keywordMode||'any')}</div><div class="form-grid form-block">${textarea('匹配关键词（每行一个）','cr-words-'+index,rule.keywords?.join('\n')||rule.match||'','仅关键词模式使用',3)}${textarea('正则表达式','cr-regex-'+index,rule.regex||'','仅正则模式使用',3)}</div><div class="check-grid form-block">${cbox('cr-enabled-'+index,'启用规则',rule.enabled!==false)}${cbox('cr-popup-'+index,'命中后显示弹窗',rule.popup!==false,'可单独决定是否弹窗')}</div><div class="form-grid form-block">${select('弹窗类型','cr-popup-type-'+index,[['verification','验证码弹窗'],['normal','普通消息弹窗'],['important','重要提醒弹窗'],['system','系统通知样式']],rule.popupType||'normal')}${select('验证码提取方式','cr-extractor-'+index,[['auto','自动提取 4–8 位数字'],['regex','使用自定义提取正则'],['none','不提取验证码']],extractor,'仅验证码消息类型执行提取')}</div><div class="form-block">${field('验证码提取正则（可选）','cr-extract-'+index,rule.extractRegex||'','例如 (\\d{6})')}</div><div style="display:flex;justify-content:flex-end;margin-top:11px">${B(`${I('eye')} 弹窗预览`,`App.rulePreview(${index})`,'sm')}</div></div>`}
function channelRouteCard(r,index){return `<div class="rule-card" data-chan-route="${index}"><div class="rule-top"><div><b>↕ 内容分流 ${index+1}</b><small>首条命中规则选择目标设备；未命中使用兜底设备</small></div><div class="actions">${B('↑',`App.moveRoute(${index},-1)`,'xs')}${B('↓',`App.moveRoute(${index},1)`,'xs')}${B('删除',`App.removeRoute(${index})`,'xs danger')}</div></div><div class="form-grid form-block">${field('分流名称','route-name-'+index,r.name||'')}${select('匹配方式','route-mode-'+index,[['keywords','关键词'],['regex','正则表达式']],r.matchMode||'keywords')}</div><div class="form-grid form-block">${textarea('匹配关键词（每行一个）','route-words-'+index,r.keywords?.join('\n')||r.match||'','关键词模式',3)}${textarea('匹配正则','route-regex-'+index,r.regex||'','正则模式',3)}</div><div class="form-block"><b class="tiny">规则命中时推送目标设备</b><div class="check-grid" style="margin-top:8px">${state.devices.filter(d=>d.identity===state.channelDraft.identity).map(d=>cbox(`route-dev-${index}-${d.id}`,d.name,(r.devices||[]).includes(d.id),d.system)).join('')}</div></div><div class="form-block">${cbox('route-enabled-'+index,'启用此分流规则',r.enabled!==false)}</div></div>`}
function channelBody(){const c=state.channelDraft,tab=state.channelModalTab;return `<div class="tabline">${[['basic','渠道与设备'],['rules','消息规则'],['routes','内容分流']].map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="App.channelTab('${id}')">${n}${id==='rules'?` · ${c.rules.length}`:id==='routes'?` · ${c.routes.length}`:''}</button>`).join('')}</div>`+(tab==='basic'?`${state.channelEditing?'':`<div class="notice" style="margin-bottom:15px">渠道新建后所属身份不可更改，公共推送只作用于该身份的设备。</div>`}<div class="form-grid">${field('渠道名称','channel-name',c.name,'例如：登录验证码')}${field('渠道 ID（可选，可编辑）','channel-id',c.id,'留空自动生成；允许字母、数字、点、短横线、下划线')}</div><div class="form-block">${select('所属身份','channel-identity',(isAdmin()?state.identities:state.identities.filter(i=>i.id===ownIdentity())).map(i=>[i.id,i.name]),c.identity,'创建后不可变更身份归属',state.channelEditing||!isAdmin()?'disabled':'')}</div><div class="form-block">${togg('channel-all','默认推送到本身份全部设备',c.all,'未命中任何分流规则时，动态选择本身份所有已批准设备。')}</div><div class="form-block"><b class="tiny">默认 / 兜底设备</b><div class="check-grid" style="margin-top:7px">${state.devices.filter(d=>d.identity===c.identity).map(d=>cbox('channel-dev-'+d.id,d.name,c.devices.includes(d.id),d.system)).join('')||'<p class="muted">当前身份暂无已批准设备</p>'}</div><p class="muted tiny">未命中分流规则且兜底设备为空时，会拒绝推送。</p></div><div class="form-block"><b class="tiny">推送 URL 预览</b><div class="inline-code" id="channel-url-text" style="margin-top:6px">https://relay.example.com:20800/api/v1/push/${E(c.id||'{channelId}')}</div></div>`:tab==='rules'?`<div class="notice">规则从上至下匹配，首条命中决定验证码 / 普通消息 / 重要提醒，以及是否弹窗、弹窗类型。仅验证码类型执行验证码提取。默认验证码规则可编辑和停用，未命中规则仍保存推送但不弹窗。</div>${c.rules.map(channelRuleCard).join('')}<div style="margin-top:13px">${B(`${I('plus')} 新增消息规则`,'App.addRule()','sm primary')}</div><div class="popup-preview form-block" id="rule-preview" style="display:none"></div>`:`<div class="notice">按顺序匹配正文，第一条命中决定目标设备；未命中走兜底设备。设备只可从当前身份下选择。</div>${c.routes.map(channelRouteCard).join('')||'<div class="muted tiny" style="padding:20px 0">尚无分流规则，消息直接送往兜底设备。</div>'}<div style="margin-top:13px">${B(`${I('plus')} 新增内容分流`,'App.addRoute()','sm primary')}</div>`)}
function syncChannelDraft(){const c=state.channelDraft;if(!c)return;if(state.channelModalTab==='basic'&&inp('channel-name')){c.name=v('channel-name').trim();c.id=v('channel-id').trim();c.all=checked('channel-all');if(!state.channelEditing)c.identity=v('channel-identity');c.devices=state.devices.filter(d=>d.identity===c.identity&&checked('channel-dev-'+d.id)).map(d=>d.id)}if(state.channelModalTab==='rules'){c.rules.forEach((r,i)=>{if(!inp('cr-name-'+i))return;r.name=v('cr-name-'+i);r.type=v('cr-type-'+i);r.matchType=v('cr-mode-'+i);r.keywordMode=v('cr-logic-'+i);r.keywords=v('cr-words-'+i).split('\n').map(s=>s.trim()).filter(Boolean);r.regex=v('cr-regex-'+i);r.enabled=checked('cr-enabled-'+i);r.popup=checked('cr-popup-'+i);r.popupType=v('cr-popup-type-'+i);r.extractor=v('cr-extractor-'+i);r.extractRegex=v('cr-extract-'+i)})}if(state.channelModalTab==='routes'){c.routes.forEach((r,i)=>{if(!inp('route-name-'+i))return;r.name=v('route-name-'+i);r.matchMode=v('route-mode-'+i);r.keywords=v('route-words-'+i).split('\n').map(s=>s.trim()).filter(Boolean);r.regex=v('route-regex-'+i);r.enabled=checked('route-enabled-'+i);r.devices=state.devices.filter(d=>d.identity===c.identity&&checked('route-dev-'+i+'-'+d.id)).map(d=>d.id)})}}
function channelModal(id,tab='basic',preserve=false){if(!preserve){let base=state.channels.find(x=>x.id===id);state.channelEditing=base?.id||null;state.channelDraft=base?clone(base):{id:'',name:'',identity:ownIdentity()||'',all:false,devices:[],rules:[{name:'默认验证码',type:'verification_code',popup:true,popupType:'verification',enabled:true,default:true,matchType:'auto',extractor:'auto'}],routes:[]}}state.channelModalTab=tab;openModal(state.channelEditing?'配置推送渠道':'新建推送渠道','渠道按身份隔离，渠道 ID 可在后续编辑中变更；规则、目标设备及弹窗均可配置。',channelBody(),'保存渠道',saveChannel,{wide:true,extra:state.channelEditing?B('删除渠道','App.deleteChannel()','sm danger push-left'):''});if(tab==='basic'){const idInput=inp('channel-id');if(idInput)idInput.oninput=()=>{const p=inp('channel-url-text');if(p)p.textContent='https://relay.example.com:20800/api/v1/push/'+(idInput.value||'{channelId}')};if(inp('channel-identity')&&!state.channelEditing)inp('channel-identity').onchange=()=>{syncChannelDraft();state.channelDraft.identity=inp('channel-identity').value;state.channelDraft.devices=[];channelModal('',tab,true)}}}
function saveChannel(){syncChannelDraft();const c=state.channelDraft;if(!c.id&&!state.channelEditing&&c.name){c.id=c.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'channel-'+Date.now().toString(36)}if(!c.name||!c.id){state.channelModalTab='basic';channelModal('', 'basic',true);toast('请填写渠道名称');return}if(!/^[A-Za-z0-9._-]{1,80}$/.test(c.id)){state.channelModalTab='basic';channelModal('','basic',true);toast('渠道 ID 只能为 1–80 位字母、数字、点、横线或下划线');return}if(state.channels.some(x=>x.id===c.id&&x.id!==state.channelEditing)){toast('该渠道 ID 已存在');return}c.rules=c.rules.filter(r=>r.name);if(state.channelEditing){const index=state.channels.findIndex(x=>x.id===state.channelEditing);state.channels[index]=clone(c);state.messages.forEach(m=>{if(m.channel===state.channelEditing)m.channel=c.id})}else state.channels.push(clone(c));closeModal();render();toast('渠道及规则已保存（演示）')}
function moveRule(index,offset){syncChannelDraft();const arr=state.channelDraft.rules;const ni=index+offset;if(ni<0||ni>=arr.length)return;if(arr[index].default||arr[ni].default)return;[arr[index],arr[ni]]=[arr[ni],arr[index]];channelModal('', 'rules',true)}
function moveRoute(index,offset){syncChannelDraft();const arr=state.channelDraft.routes;const ni=index+offset;if(ni<0||ni>=arr.length)return;[arr[index],arr[ni]]=[arr[ni],arr[index]];channelModal('','routes',true)}
function rulePreview(index){syncChannelDraft();const r=state.channelDraft.rules[index];const p=inp('rule-preview');if(!p)return;p.style.display='block';p.innerHTML=`<b>${E(r.name||'消息弹窗')}</b><p class="muted tiny">类型：${E(r.type)} · ${r.popup?'显示弹窗':'不弹窗'} · 样式：${E(r.popupType)}</p>${r.type==='verification_code'?'<div class="preview-code">482961</div>':`<div class="card form-block" style="box-shadow:none">${E(r.name||'消息通知')}<p class="muted tiny">这是一条来自 RelayProxy 的演示推送。</p></div>`}`;p.scrollIntoView({block:'nearest',behavior:'smooth'})}
function deleteChannel(){const c=state.channelEditing;if(!c)return;confirmModal('删除消息渠道',`将移除渠道 ${c} 及其规则，不删除历史消息。`,()=>{state.channels=state.channels.filter(x=>x.id!==c);toast('渠道已删除（演示）')},'删除渠道')}
function copyUrl(id){navigator.clipboard?.writeText('https://relay.example.com:20800/api/v1/push/'+id).then(()=>toast('推送 URL 已复制')).catch(()=>toast('浏览器阻止复制，请手动复制'))||toast('请手动复制推送 URL')}
function themeSetting(value){state.theme=value;const resolved=value==='system'?(window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light'):value;document.documentElement.setAttribute('data-theme',resolved);applyThemeButtons();try{localStorage.setItem('rp-prototype-theme',value)}catch(_){}}
function applyThemeButtons(){Array.from(inp('theme-seg')?.children||[]).forEach((b,i)=>b.classList.toggle('active',['system','light','dark'][i]===state.theme))}
function command(){const options=groups.flatMap(g=>g.items).filter(x=>isAdmin()||!adminOnly.has(x[0]));openModal('快速导航','搜索页面、功能或操作；可以通过 ⌘K / Ctrl+K 随时打开。',`<input class="input" id="command-input" placeholder="例如：P2P、RDP、身份、消息、证书" oninput="App.searchCommand(this.value)" autofocus><div class="mini-list" id="command-results" style="margin-top:15px">${options.map(x=>`<div class="mini-row" style="cursor:pointer" onclick="App.go('${x[0]}');App.closeModal()"><span class="circle-icon">${I(x[1])}</span><span class="grow"><b>${x[2]}</b></span>${I('chevron')}</div>`).join('')}</div>`,null,null,{wide:false});inp('command-input')?.focus()}
function searchCommand(q){const host=inp('command-results');if(!host)return;const results=groups.flatMap(g=>g.items).filter(x=>(isAdmin()||!adminOnly.has(x[0]))&&(x[2].toLowerCase().includes(q.toLowerCase())||x[0].includes(q.toLowerCase())));host.innerHTML=results.map(x=>`<div class="mini-row" style="cursor:pointer" onclick="App.go('${x[0]}');App.closeModal()"><span class="circle-icon">${I(x[1])}</span><span class="grow"><b>${x[2]}</b></span>${I('chevron')}</div>`).join('')||'<p class="muted">未找到匹配页面</p>'}
function coverage(){const data=[['账户登录','登录 / 退出、修改密码、独立身份账号'],['总览','运行状态、设备数、出口数、活跃流、快捷操作'],['设备','待审批、能力审批、筛选、详情、身份归属、撤销与删除'],['身份权限','创建 / 禁用身份、独立登录、跨身份 Proxy/RDP 授权、版本及有效期'],['网络','出口节点、Server Exit、实时会话、30 秒诊断、P2P 路径和租约'],['消息','消息查询 / 过滤 / 删除、推送渠道创建及自定义 ID、身份隔离'],['消息规则','顺序匹配、默认验证码、普通/重要消息、关键词/正则、弹窗类型和提取正则'],['内容分流','顺序匹配、目标设备与兜底设备、动态全部设备'],['RDP','公网入口新增 / 启停 / 删除、TCP/UDP 端口、来源 CIDR、限速、有效期'],['RDP 审计','按来源 IP 聚合、目标设备名、每连接明细、分页、清除'],['IP 安全','手动封禁、自动封禁白名单、解封、封禁时间与来源范围'],['防护规则','启停、统计窗口、TCP 连接阈值、封禁时长'],['服务配置','管理访问、隧道、Public Direct、P2P/UPnP、RDP、Server Exit、证书、Relay ACL']];openModal('功能覆盖清单',`对照 main 分支 Server Web 与 API 路由整理 · ${data.length} 组功能`,T(['功能组','原型交互范围'],data.map(([k,x])=>`<tr><td><b>${k}</b></td><td>${x}</td></tr>`).join(''),590)+`<div class="notice" style="margin-top:13px">静态原型不直接调用 Server API；所有输入、修改、删除和登录均为内存中的演示操作，刷新页面会复原示例数据。</div>`,null,null,{wide:true})}
function account(){openModal('账户与安全',isAdmin()?'当前身份：Administrator · 全局管理员 · 演示会话':'当前身份：个人设备 · 身份管理员 · 演示会话',`<div class="detail-list"><div><small>登录用户</small><b>${isAdmin()?'admin':'personal'}</b></div><div><small>账户角色</small><b>${isAdmin()?'全局管理员':'身份管理员'}</b></div><div><small>当前访问</small><b>https://relay.example.com:21080</b></div><div><small>管理登录</small><b>演示模式</b></div></div><div style="display:flex;gap:8px;margin-top:15px">${B(isAdmin()?'预览身份管理员视角':'返回全局管理员视角',`App.switchRole('${isAdmin()?'identity':'admin'}')`,'sm')}${B(`${I('key')} 修改密码`,'App.password()','sm')}${B(`${I('power')} 退出登录`,'App.logout()','sm danger')}</div>`,null,null)}
function password(){openModal('修改管理密码','保存后真正的 Server 会注销当前账户的所有管理会话。',`${field('当前账号','pw-user',isAdmin()?'admin':'personal','','text','readonly')}<div class="form-grid form-block">${field('当前密码','pw-old','','','password')}${field('新密码','pw-new','','至少 8 个字符','password')}</div><div class="form-block">${field('确认新密码','pw-repeat','','','password')}</div><div class="form-block">${cbox('pw-show','显示输入的密码',false)}</div>`,'修改密码并重新登录',()=>{if(v('pw-new').length<8||v('pw-repeat')!==v('pw-new')||!v('pw-old')){toast('请检查旧密码、新密码长度及两次输入是否一致');return}closeModal();inp('login-screen').classList.add('open');toast('密码已修改（演示），请重新登录')})}
function switchRole(role){closeModal();state.selectedRole=role==='identity'?'identity':'admin';state.page='overview';inp('role-display').textContent=isAdmin()?'全局管理员':'身份管理员 · 个人设备';render();inp('main-scroll').scrollTop=0;toast('已切换界面权限视角（演示）')}
function logout(){closeModal();inp('login-screen').classList.add('open');toast('已退出演示会话')}
function login(){if(!v('login-name')||!v('login-password')){toast('请输入登录信息');return}inp('login-screen').classList.remove('open');inp('user-display').textContent=v('login-name');toast('已进入演示控制台')}
function cfgChange(el){const key=el.dataset.cfg;if(!key)return;state.cfg[key]=el.type==='checkbox'?el.checked:el.value;state.settingsDirty=JSON.stringify(state.cfg)!==JSON.stringify(state.cfgSaved);const bar=inp('settings-save');if(bar){const dirty=state.settingsDirty;bar.classList.toggle('dirty',dirty);const b=bar.querySelector('.grow b');if(b)b.textContent=dirty?'有未保存的配置修改':'所有配置已保存';const sm=bar.querySelector('.grow small');if(sm)sm.textContent=(dirty?'请保存或放弃本次改动':'演示配置 · server.yaml')+' · 部分配置需重启';const commit=inp('settings-commit-btn'),discard=inp('settings-discard-btn');if(commit)commit.disabled=!dirty;if(discard)discard.disabled=!dirty;const indicator=bar.querySelector('.settings-save-indicator');if(indicator)indicator.innerHTML=I(dirty?'info':'check',19);const statusKeys={admin:'adminTLS',direct:'directEnabled',p2p:'upnpEnabled',rdp:'rdpEnabled',exit:'exitEnabled'};if(statusKeys[state.settingTab]===key){const badge=document.querySelector('.config-card-accessory .badge');if(badge){const on=state.cfg[key]===true||state.cfg[key]==='true';badge.textContent=key==='adminTLS'?(on?'HTTPS':'HTTP'):(on?'已启用':'已停用');badge.className='badge '+(key==='adminTLS'?'blue':(on?'ok':'warn'))}}}}
function setTab(id){state.settingTab=id;state.page='settings';try{location.hash='settings/'+id}catch(_){}render();inp('main-scroll').scrollTop=0}
function saveSettings(){for(const [a,b] of [['p2pPortStart','p2pPortEnd'],['directPortStart','directPortEnd'],['rdpPortStart','rdpPortEnd']]){const start=Number(state.cfg[a]),end=Number(state.cfg[b]);if(start>end||(start===0)!==(end===0)){toast('端口范围起始必须不大于结束，随机端口需填写 0 / 0');return}}state.cfgSaved=clone(state.cfg);state.settingsDirty=false;state.restart=true;render();toast('配置已保存（演示），部分字段重启后生效')}
function discardSettings(){state.cfg=clone(state.cfgSaved);state.settingsDirty=false;render();toast('已放弃未保存的修改')}
window.App={
 go(page){if(!isAdmin()&&adminOnly.has(page)){toast('当前身份无权访问该管理页面');return}if(state.settingsDirty&&state.page==='settings'&&page!=='settings'){toast('还有未保存的服务配置，请先保存或放弃修改');return}state.page=page;try{location.hash=page}catch(_){}closeModal();render();inp('main-scroll').scrollTop=0},
 setTab,theme:themeSetting,refresh(){render();toast('演示数据已刷新')},copy(text){navigator.clipboard?.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>toast('浏览器不允许直接复制'))||toast('请手动复制')},
 filter(key,value,focusId){state[key]=value;if(key==='auditQ')state.auditPage=1;const e=focusId?inp(focusId):null;const pos=e&&typeof e.selectionStart==='number'?e.selectionStart:null;render();if(focusId){const n=inp(focusId);if(n){n.focus();if(pos!==null)try{n.setSelectionRange(pos,pos)}catch(_){}}}},
 auditPageSize(value){state.auditSize=Number(value)||20;state.auditPage=1;render()},auditNext(delta){state.auditPage+=delta;render()},
 device:deviceModal,ownership,enrollment,rejectEnrollment,revokeDevice,deleteDevice,identity:identityModal,grant:grantModal,deleteGrant,serverGrant:serverGrantModal,deleteServerGrant,
 message:messageModal,deleteMessage,clearMessages,channel:channelModal,channelMessages(id){state.msgChannel=id;this.go('messages')},copyUrl,
 channelTab(tab){syncChannelDraft();channelModal('',tab,true)},addRule(){syncChannelDraft();const a=state.channelDraft.rules;const insertAt=a.findIndex(x=>x.default);const r={name:'新消息规则',type:'message',matchType:'keywords',keywords:[],popup:true,popupType:'normal',enabled:true,extractor:'auto'};a.splice(insertAt<0?a.length:insertAt,0,r);channelModal('','rules',true)},removeRule(i){syncChannelDraft();if(state.channelDraft.rules[i].default)return;state.channelDraft.rules.splice(i,1);channelModal('','rules',true)},moveRule,rulePreview,
 addRoute(){syncChannelDraft();state.channelDraft.routes.push({name:'新分流',matchMode:'keywords',keywords:[],devices:[],enabled:true});channelModal('','routes',true)},removeRoute(i){syncChannelDraft();state.channelDraft.routes.splice(i,1);channelModal('','routes',true)},moveRoute,deleteChannel,
 capture,diagnosticDetail,newIngress,toggleIngress,deleteIngress,auditDetails,clearAudit,newBan,deleteBan,editRule,toggleRule(id,enabled){const r=state.rdpRules.find(x=>x.id===id);if(r){r.enabled=enabled;toast('已更新规则启用状态（演示）')}},
 cfgChange,saveSettings,discardSettings,account,password,logout,login,command,searchCommand,coverage,switchRole,
 closeModal(){state.modalCancel?.();closeModal()},saveModal(){if(typeof state.modalSave==='function')state.modalSave()}
};
const logo=I('activity',23);inp('brand-icon').innerHTML=logo;inp('login-mark').innerHTML=logo;inp('search-icon').innerHTML=I('search',15);inp('refresh-icon').innerHTML=I('refresh',16);inp('user-icon').innerHTML=I('users',15);inp('user-arrow').innerHTML=I('chevron',15);
try{const saved=localStorage.getItem('rp-prototype-theme');if(['system','light','dark'].includes(saved))state.theme=saved}catch(_){}themeSetting(state.theme);
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.theme==='system')themeSetting('system')});
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();command()}else if(e.key==='Escape'&&inp('modal-overlay').classList.contains('open'))closeModal()});
window.addEventListener('hashchange',()=>{const name=location.hash.replace('#','').split('/')[0];const tab=location.hash.split('/')[1];if(pageTitles[name]){if(name==='settings'&&settingTabs.some(a=>a[0]===tab))state.settingTab=tab;state.page=name;render()}});
const initPage=location.hash.replace('#','').split('/')[0];const initTab=location.hash.split('/')[1];if(pageTitles[initPage])state.page=initPage;if(state.page==='settings'&&settingTabs.some(x=>x[0]===initTab))state.settingTab=initTab;render();
})();
