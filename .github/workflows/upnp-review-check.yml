name: UPnP review check

on:
  push:
    branches:
      - fix/p2p-upnp-review

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and show diff
        run: |
          gofmt -w internal/p2p/upnp/upnp.go internal/p2p/upnp/upnp_test.go agent/p2p/endpoint.go
          git diff -- internal/p2p/upnp/upnp.go internal/p2p/upnp/upnp_test.go agent/p2p/endpoint.go
      - name: Test UPnP
        run: go test -v -timeout 30s ./internal/p2p/upnp
      - name: Test P2P
        run: go test -timeout 90s ./agent/p2p
