server:
  tls_enabled: true   # Agent 隧道 TLS 开关；QUIC 需要开启
  quic:
    listen: ":20000"
  tls:
    listen: ":20000"
  admin:
    listen: ":20001"
    tls_enabled: false  # 管理页独立使用 HTTP，可直接通过 http://IP:8443 访问
  cert_file: "cert/server.crt"
  key_file: "cert/server.key"

# V1 uses SQLite only (WAL + busy_timeout enabled in OpenDB).
database:
  driver: "sqlite"
  dsn: "relayproxy.db"

tunnel:
  heartbeat_sec: 15
  max_connections_per_device: 1024
  max_connections: 2048
  # Relay QUIC 的 Hysteria Brutal 每客户端上限。Agent 没有请求带宽时仍使用 BBR。
  bandwidth:
    up_mbps: 0                 # Server -> Agent 上限；0 = 不限制 Agent 的请求值
    down_mbps: 0               # Agent -> Server 上限；0 = 不限制 Agent 的请求值
    ignore_client_bandwidth: false
    disable_loss_compensation: false

# RDP P2P/rendezvous 与公网兼容入口。公网入口默认关闭；开启前请配置
# 可路由的 rendezvous_advertise，并在管理页面按目标设备分配固定端口。
rdp:
  lease_sec: 60
  rendezvous_listen: ""       # 例如 :3478；留空则关闭 UDP 反射探测
  rendezvous_advertise: ""    # 例如 relay.example.com:3478
  ingress:
    enabled: false
    listen: "0.0.0.0:0"       # 端口由管理页面的 allocation 固定分配
    port_start: 20100
    port_end: 20200
    source_cidrs: []
    rate_limit_per_minute: 120



# Public Direct lets verified public Exit UDP endpoints accept authenticated
# QUIC directly. Server verification is mandatory before endpoints are published.
direct:
  enabled: true
  port_start: 0                  # 0/0 表示 Agent 使用系统分配的随机 UDP 端口
  port_end: 0                    # 例如 31000-31100；需在 Exit 主机/公网防火墙放行 UDP

# Proxy P2P direct path control/rendezvous. Payload traffic falls back to
# Relay when no direct path is ready.
p2p:
  enabled: true
  rendezvous_listen: ""       # 例如 :3479；可与 RDP 使用不同 UDP 端口
  rendezvous_advertise: ""    # 例如 relay.example.com:3479
  lease_sec: 60
  max_sessions_per_device: 8
  port_start: 0                  # 0/0 表示 Agent 使用系统分配的随机 UDP 端口
  port_end: 0                    # 例如 30000-30100；配置后需放行 Agent 侧对应 UDP 范围
  upnp_enabled: false            # 开启后 Agent 尝试通过本地路由器 UPnP 映射 P2P UDP 端口

# Relay Server 本机也可以作为网络出口。默认关闭；开启后客户端使用
# exitDeviceId=server 即可明确选择服务端出口。
exit:
  enabled: false
  allow_internet: true
  allow_private_network: false
  allow_loopback: false
  upstream:
    mode: direct             # direct | socks5 | http | https
    address: ""              # 非 direct 时填写 host:port
  access:
    mode: ""
    domains: []
    cidrs: []

# 中央目标权限与出口本地策略取交集。
# 公司内网/VPN 出口需在两处显式允许 private_network。
relay_acl:
  allow_internet: true
  allow_private_network: false
  allow_loopback: false
  access:
    mode: ""
    domains: []
    cidrs: []

logging:
  level: "info"
