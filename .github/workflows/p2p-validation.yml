name: P2P Direct Path Validation

on:
  push:
    branches:
      - feat/proxy-p2p-direct-path

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/protocol/p2p.go
            server/p2p/coordinator.go
            server/p2p/coordinator_test.go
            internal/tunnel/quic.go
            internal/tunnel/datagram.go
            internal/tunnel/capability_test.go
            agent/p2p/manager.go
            agent/client/dialer.go
            agent/client/resumable_tcp.go
            agent/client/resumable_tcp_integration_test.go
            internal/p2p/resume/frame.go
            internal/p2p/resume/state.go
            internal/p2p/resume/endpoint.go
            internal/p2p/resume/endpoint_test.go
            agent/app/agent.go
            mobile/androidcore/client.go
            server/gateway/listener.go
          )
          bad="$(gofmt -l "${files[@]}")"
          if [ -n "$bad" ]; then
            echo "$bad"
            gofmt -d $bad
            exit 1
          fi
      - name: P2P and resume tests
        run: go test ./internal/p2p/... ./internal/tunnel ./agent/p2p ./agent/client ./agent/exit ./server/p2p ./server/gateway -count=1
      - name: Agent and Android compile tests
        run: go test ./agent/app ./mobile/androidcore -count=1
