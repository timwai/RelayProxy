 function modal(title,body,actions){$('modal-title').textContent=title;$('modal-body').innerHTML=body;$('modal-actions').innerHTML=actions||button('关闭','modal-close');$('modal').classList.add('show');}
 const currentDevice=id=>devices.find(d=>d.id===id);
 function modalDeviceApprove(id){const d=currentDevice(id);if(!d)return;modal('审批浏览器设备','<div class="device" style="margin-bottom:20px"><span class="circle mac">'+icon('laptop')+'</span><div><b>'+escapeHTML(d.name)+'</b><small>'+escapeHTML(d.id)+'</small></div></div><label class="field"><span class="field-label">所属身份</span><select id="approve-identity"><option value="个人设备">个人设备</option><option value="办公设备">办公设备</option></select></label><div class="field-label" style="margin-top:20px">允许的操作</div><label class="checkrow"><input type="checkbox" id="cap-send" checked /><div><strong>发送登录状态</strong><small>可以向已配对设备发送网站会话</small></div></label><label class="checkrow"><input type="checkbox" id="cap-receive" checked /><div><strong>接收登录状态</strong><small>可以接收已配对设备的会话</small></div></label>',button('取消','modal-close')+button('批准设备','confirm-approve:'+id,'primary'));
 }
 function modalDeviceManage(id){const d=currentDevice(id);if(!d)return;modal('管理浏览器设备','<div class="device"><span class="circle">'+icon('laptop')+'</span><div><b>'+escapeHTML(d.name)+'</b><small>'+escapeHTML(d.id)+'</small></div></div><div class="mini-kv"><span>所属身份</span><b>'+d.identity+'</b></div><div class="mini-kv"><span>授权操作</span><b>'+d.cap+'</b></div><div class="mini-kv"><span>状态</span>'+statusBadge(d.state)+'</div>',button('关闭','modal-close')+button('撤销授权','revoke:'+id,'danger'));
 }
 function manageRule(id){const r=rules.find(x=>x.id===id);if(!r)return;modal('配对设置','<div class="mini-kv"><span>网站</span><b>'+r.host+'</b></div><div class="mini-kv"><span>来源设备</span><b>'+r.source+'</b></div><div class="mini-kv"><span>接收设备</span><b>'+r.target+'</b></div><div class="mini-kv"><span>会话范围</span><b>Cookie、Storage、IndexedDB</b></div><div style="margin-top:21px"><label class="field"><span class="field-label">网站访问使用的网络出口</span><select id="rule-network"><option>本机直连</option><option '+(r.network==='来源设备出口'?'selected':'')+'>来源设备出口</option><option>本机 Agent</option></select></label></div><label class="checkrow" style="margin-top:19px"><input type="checkbox" id="allow-overwrite" /><div><strong>允许覆盖接收端登录数据</strong><small>包括 IndexedDB，可能切换网站账号</small></div></label><div class="actions" style="margin-top:20px">'+button('撤销配对','revoke-rule:'+id,'danger')+'</div>',button('取消','modal-close')+button('保存设置','save-rule:'+id,'primary'));
 }
 function addSaveBar(){
   const bar=document.createElement('div');bar.className='savebar';
   bar.innerHTML='<div><strong>有未保存的修改</strong><small>配置会在保存后按运行要求生效</small></div><div class="actions">'+button('取消','discard-config')+button('保存修改','save-config','primary')+'</div>';
   $('page').append(bar);
 }
 function attachPageEvents(){
   $('server-device-search')?.addEventListener('input',e=>{state.serverSearch=e.target.value;$('device-rows').innerHTML=deviceRows();});
   document.querySelectorAll('[data-config-input]').forEach(x=>x.addEventListener('input',()=>{
     const g=configGroups.find(g=>g.id===state.serverGroup);
     const f=g?.fields.find(f=>f[0]===x.dataset.configInput);
     if(f){f[3]=x.type==='number'?Number(x.value):x.value;}
     state.dirty=true;
     if(!document.querySelector('.savebar'))addSaveBar();
   }));
 }
 function handleAction(action){
  if(action==='modal-close'){closeModal();return}
  if(action==='refresh-devices'||action==='refresh-rules'){toast('列表已刷新');return}
  if(action==='open-browser-config'){state.serverPage='settings';state.serverGroup='browserSync';render();return}
  if(action==='go-devices'){state.serverPage='browser';render();return}
  if(action==='reset-config'){modal('恢复配置','要放弃当前页面的修改吗？',button('取消','modal-close')+button('确定恢复','discard-config','primary'));return}
  if(action==='discard-config'){const defaults=JSON.parse(configDefaults);configGroups.forEach((g,i)=>{g.fields=defaults[i].fields});state.dirty=false;closeModal();render();toast('已放弃未保存修改');return}
  if(action==='save-config'){state.dirty=false;render();toast('配置已保存（模拟）');return}
  if(action==='grant-identity'){modal('授权身份','<label class="field"><span class="field-label">身份</span><select><option>个人设备</option><option>办公设备</option></select></label><label class="field" style="margin-top:16px"><span class="field-label">授权范围</span><input value="允许使用 Server 出口" disabled /></label>',button('取消','modal-close')+button('授权','mock-grant','primary'));return}
  if(action==='mock-grant'){closeModal();toast('身份授权已添加（模拟）');return}
  if(action==='all-extensions'){modal('扩展来源',extensions.map(x=>'<div class="mini-kv"><div><strong>'+x.name+'</strong><div class="mono">'+x.id+'</div></div>'+statusBadge(x.state)+'</div>').join(''),button('关闭','modal-close'));return}
  if(action.startsWith('approve:')){modalDeviceApprove(action.slice(8));return}
  if(action.startsWith('confirm-approve:')){const id=action.slice(16),d=currentDevice(id);if(d){d.state='approved';d.identity=$('approve-identity').value;d.cap=[$('cap-send').checked?'发送':'',$('cap-receive').checked?'接收':''].filter(Boolean).join(' · ')||'无';}closeModal();render();toast('设备已批准');return}
  if(action.startsWith('manage:')){modalDeviceManage(action.slice(7));return}
  if(action.startsWith('revoke:')){const id=action.slice(7);modal('撤销设备授权','撤销后，这台设备无法继续同步。确认撤销？',button('取消','modal-close')+button('确认撤销','confirm-revoke:'+id,'danger'));return}
  if(action.startsWith('confirm-revoke:')){const d=currentDevice(action.slice(15));if(d){d.state='revoked';d.cap='—'}closeModal();render();toast('授权已撤销');return}
  if(action.startsWith('delete:')){const id=action.slice(7);modal('删除旧设备','将永久删除已撤销设备及其关联的配对记录，且无法恢复。',button('取消','modal-close')+button('永久删除','confirm-delete:'+id,'danger'));return}
  if(action.startsWith('confirm-delete:')){const i=devices.findIndex(d=>d.id===action.slice(15));if(i>=0)devices.splice(i,1);closeModal();render();toast('旧设备已删除');return}
  if(action.startsWith('manage-extension:')){const e=extensions.find(x=>x.id===action.slice(17));if(!e)return;modal('管理扩展来源','<div class="mono">'+e.id+'</div><div style="margin-top:15px">'+statusBadge(e.state)+'</div>',button('取消','modal-close')+button('撤销扩展','revoke-extension:'+e.id,'danger'));return}
  if(action.startsWith('revoke-extension:')){const e=extensions.find(x=>x.id===action.slice(17));if(e)e.state='revoked';closeModal();render();toast('扩展来源已撤销');return}
  if(action.startsWith('delete-extension:')){const id=action.slice(17);const attached=devices.some(d=>d.ext===id.slice(0,6)+'…'+id.slice(-5));modal('删除旧扩展','已撤销的扩展来源可永久清除。关联设备仍存在时，需先清理设备。',button('取消','modal-close')+button('确认删除','confirm-delete-extension:'+id,'danger'));return}
  if(action.startsWith('confirm-delete-extension:')){const id=action.slice(25);const e=extensions.find(x=>x.id===id);if(e && devices.some(d=>d.ext===id.slice(0,6)+'…'+id.slice(-5))){toast('仍有关联设备，请先删除旧设备',true);return}const i=extensions.findIndex(x=>x.id===id);if(i>=0)extensions.splice(i,1);closeModal();render();toast('旧扩展已删除');return}
  if(action==='save-server-url'){const v=$('ext-url').value.trim();try{const u=new URL(v);if(u.protocol!=='https:'||u.pathname!=='/'||u.username||u.password||u.search||u.hash)throw Error('invalid');state.serverURL=u.origin;render();toast('Server 地址已保存');}catch{toast('请输入有效的 HTTPS Server 根地址',true)}return}
  if(action==='connect-server'){state.extensionOnline=true;render();toast('设备认证已连接（模拟）');return}
  if(action==='toggle-connection'){state.extensionOnline=!state.extensionOnline;render();toast(state.extensionOnline?'Server 已连接':'已断开连接');return}
  if(action==='request-auth'){modal('重新申请设备授权','将向 Server 提交当前浏览器设备的身份公钥。',button('取消','modal-close')+button('提交申请','confirm-auth','primary'));return}
  if(action==='confirm-auth'){closeModal();toast('授权申请已提交');return}
  if(action==='copy-device'){try{navigator.clipboard?.writeText('browser_f3ad1f8c-21ba-4d7c')}catch{}toast('已复制设备 ID');return}
  if(action==='add-site'){modal('授权网站','<label class="field"><span class="field-label">从当前标签页选择</span><select id="new-site"><option value="https://notion.so">notion.so</option><option value="https://openai.com">openai.com</option><option value="https://example.org">example.org</option></select></label>',button('取消','modal-close')+button('授权网站','confirm-add-site','primary'));return}
  if(action==='add-selected-site'||action==='confirm-add-site'){const v=$(action==='confirm-add-site'?'new-site':'site-target')?.value;if(v && !sites.some(x=>x.full===v)){const host=new URL(v).hostname;sites.push({host,full:v,icon:host.slice(0,2).toUpperCase(),color:'#5576b9'})}closeModal();render();toast('网站已授权');return}
  if(action.startsWith('remove-site:')){const host=action.slice(12);modal('移除站点授权','移除后，将无法继续对这个站点进行会话同步。',button('取消','modal-close')+button('移除授权','confirm-remove-site:'+host,'danger'));return}
  if(action.startsWith('confirm-remove-site:')){const host=action.slice(20),i=sites.findIndex(x=>x.host===host);if(i>=0)sites.splice(i,1);closeModal();render();toast('站点授权已移除');return}
  if(action==='create-pairing'){modal('创建会话配对','<div class="two-col"><label class="field"><span class="field-label">接收设备</span><select id="pair-device"><option>Windows 11 · Chrome</option><option>Mac mini · Chrome</option></select></label><label class="field"><span class="field-label">网站</span><select id="pair-website">'+sites.map(x=>'<option value="'+x.full+'">'+x.host+'</option>').join('')+'</select></label></div><div class="soft-panel" style="margin-top:18px"><strong style="font-size:13px">同步范围</strong><div class="scope"><span>Cookie</span><span>Local Storage</span><span>Session Storage</span><span>IndexedDB</span></div></div>',button('取消','modal-close')+button('创建邀请','confirm-create-pair','primary'));return}
  if(action==='confirm-create-pair'){const url=$('pair-website').value,host=new URL(url).hostname,target=$('pair-device').value;rules.unshift({id:Date.now(),host,url,source:'当前设备',target,mode:'发送',status:'offered',network:'未设置',code:'481-627',v:3});closeModal();state.extensionPage='pairings';render();toast('邀请已创建，等待对方确认');return}
  if(action.startsWith('accept-rule:')){const r=rules.find(x=>x.id==action.slice(12));if(!r)return;modal('确认配对邀请','<div class="mini-kv"><span>网站</span><b>'+r.host+'</b></div><div class="mini-kv"><span>来源设备</span><b>'+r.source+'</b></div><div class="mini-kv"><span>配对校验码</span><b style="font-size:18px;letter-spacing:2px">'+r.code+'</b></div><label class="checkrow"><input type="checkbox" id="code-checked" /><div><strong>已与对方核对校验码</strong></div></label>',button('取消','modal-close')+button('确认配对','confirm-accept:'+r.id,'primary'));return}
  if(action.startsWith('confirm-accept:')){if(!$('code-checked')?.checked){toast('请先确认已核对校验码',true);return}const r=rules.find(x=>x.id==action.slice(15));if(r)r.status='active';closeModal();render();toast('配对已启用');return}
  if(action.startsWith('sync-rule:')||action.startsWith('sync-open:')){toast(action.startsWith('sync-open:')?'已请求同步，完成后打开网站':'同步请求已发送');return}
  if(action.startsWith('manage-rule:')){manageRule(Number(action.slice(12)));return}
  if(action.startsWith('save-rule:')){const r=rules.find(x=>x.id==action.slice(10));if(r)r.network=$('rule-network')?.value||r.network;closeModal();render();toast('配对设置已保存');return}
  if(action.startsWith('revoke-rule:')){const id=Number(action.slice(12));modal('撤销配对','撤销后，不再同步此站点会话。',button('取消','modal-close')+button('确认撤销','confirm-revoke-rule:'+id,'danger'));return}
  if(action.startsWith('confirm-revoke-rule:')){const i=rules.findIndex(x=>x.id==action.slice(20));if(i>=0)rules.splice(i,1);closeModal();render();toast('配对已撤销');return}
  if(action==='apply-network'){const n=$('network-port');if(n)state.port=Number(n.value);toast('浏览器网络设置已应用（模拟）');return}
  if(action==='goto-pairings'){state.extensionPage='pairings';render();return}
  if(action==='goto-ext'){state.context='extension';state.extensionPage='connection';render();return}
 }
 document.addEventListener('click',e=>{
  const context=e.target.closest('[data-context]');if(context){state.context=context.dataset.context;state.mobile=false;render();return}
  const page=e.target.closest('[data-page]');if(page){if(state.context==='server')state.serverPage=page.dataset.page;else state.extensionPage=page.dataset.page;state.mobile=false;render();return}
  const group=e.target.closest('[data-group]');if(group){state.serverGroup=group.dataset.group;state.mobile=false;render();return}
  const sfilter=e.target.closest('[data-sfilter]');if(sfilter){state.serverFilter=sfilter.dataset.sfilter;render();return}
  const efilter=e.target.closest('[data-efilter]');if(efilter){state.extensionFilter=efilter.dataset.efilter;render();return}
  const sw=e.target.closest('[data-config-switch]');if(sw){
    const g=configGroups.find(g=>g.id===state.serverGroup);
    const f=g?.fields.find(f=>f[0]===sw.dataset.configSwitch);
    if(f)f[3]=!f[3];
    state.dirty=true;render();return
  }
  const proxy=e.target.closest('[data-fullproxy]');if(proxy){state.fullProxy=!state.fullProxy;render();return}
  const action=e.target.closest('[data-action]');if(action){handleAction(action.dataset.action);return}
  const close=e.target.closest('[data-close]');if(close){closeModal();return}
 });
 $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 $('toggle-menu').addEventListener('click',()=>{state.mobile=!state.mobile;$('sidebar').classList.toggle('mobile-open',state.mobile)});
 render();
})();
</script>
</body>
