name: Format Agent Custom Exit Branch
on:
  push:
    branches:
      - feature/agent-custom-exits
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/agent-custom-exits
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format Go source on development branch
        run: |
          gofmt -w agent/routing/custom_exit.go agent/routing/custom_exit_test.go agent/routing/selected_exit.go agent/routing/selected_exit_test.go agent/routing/dialer.go agent/exit/custom_dial.go agent/app/agent.go cmd/relay-agent/main.go internal/config/config.go internal/config/validation.go agent/bridge/bridge.go agent/gui/bindings_windows.go agent/gui/web.go agent/divert/server.go
          if ! git diff --quiet; then
            git config user.name "RelayProxy CI"
            git config user.email "relayproxy-ci@users.noreply.github.com"
            git add -u
            git commit -m "style: gofmt local exits and route dispatcher"
            git push origin HEAD:feature/agent-custom-exits
          fi
