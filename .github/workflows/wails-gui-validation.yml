name: Wails Windows GUI validation

on:
  push:
    branches:
      - feature/wails-windows-gui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/wails-windows-gui
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format and tidy
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w agent/gui/*.go
          go mod tidy
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum agent/gui
            git commit -m "chore(gui): format and tidy Wails migration"
            git push origin HEAD:feature/wails-windows-gui
          fi

      - name: Unit tests
        run: go test ./...

      - name: Compile Windows GUI tests
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./agent/gui -o /tmp/relay-gui-amd64.test.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go test -c ./agent/gui -o /tmp/relay-gui-arm64.test.exe

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o /tmp/relay-agent-gui-amd64.exe ./cmd/relay-agent

      - name: Build Windows arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-H=windowsgui" -o /tmp/relay-agent-gui-arm64.exe ./cmd/relay-agent

      - name: Verify Wails binding names
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.23
          rm -rf /tmp/wails-bindings
          wails3 generate bindings -names -d /tmp/wails-bindings ./agent/gui
          grep -R -F 'gui.WailsService.GetConfig' /tmp/wails-bindings
          grep -R -F 'gui.WailsService.GetConnections' /tmp/wails-bindings
