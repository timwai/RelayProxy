# 客户端填写服务端地址和 Server 自动生成的 16 位身份 ID。首次连接后，需要使用该身份
# 独立登录 Server，并在待审批设备中勾选能力。安装私钥由客户端自动管理。
server:
  address: relay.example.com
  # insecure_tls: false  # 仅可信开发环境；开启后跳过服务端证书验证

device:
  identity_id: a1b2c3d4e5f6g7h8
  name: My-PC

# Relay QUIC 默认使用 BBR Aggressive。只有明确填写实际可用带宽时才启用
# Hysteria Brutal；不要填写高于真实链路容量的数值，否则会增加丢包和抖动。
transport:
  mode: auto
  bandwidth:
    up_mbps: 0                 # 本机 -> Server；0 = BBR Aggressive
    down_mbps: 0               # Server -> 本机；0 = BBR Aggressive
    disable_loss_compensation: false

# 两种代理各自的连接上限；SOCKS5 UDP association 计入 SOCKS5 上限。
# 多标签浏览器可按设备资源提高到 1024。修改后重启 Agent 生效。
proxy:
  max_connections: 256
  idle_timeout_sec: 300        # TCP 双向空闲超时
  udp_idle_timeout_sec: 300    # UDP 关联双向有效报文空闲超时，独立于 TCP control

# P2P 直连默认自动启用：首个连接立即走 Relay，后台建立直连；
# 后续连接优先复用 P2P QUIC。relay_only 可完全关闭直连尝试。
p2p:
  enabled: true
  mode: auto
  punch_timeout_ms: 1200
  keepalive_sec: 10
  idle_timeout_sec: 120
  max_exit_sessions: 4
  fallback: true

# 可选。仅用于公网端口转发、云主机 DNS 等无法从本机接口直接发现的场景。
# Server 仍会主动探测并验证该地址，验证失败不会下发给客户端。
direct:
  public:
    advertise: ""              # 例如 exit.example.com:35820

# 可选：Linux LAN 网关。设备把默认网关和 DNS 指向本机固定 LAN IP。
# 无需客户端；需要 root、nftables、iproute2。复用 routing 公共规则。
# gateway:
#   enabled: true
#   interface: eth0
#   source_cidrs: [192.168.50.0/24]
#   exit_id: group:home
#   port: 15080
#   max_connections: 1024
# routing.device_groups 示例：
# - id: group:home
#   name: 家庭主备
#   members: [primary-agent-device-id, backup-agent-device-id]
