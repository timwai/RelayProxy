<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RelayProxy · 实时连接</title>
  <style>
    :root{color-scheme:dark;--bg:#101722;--panel:#172130;--line:#2a3749;--text:#e8eef6;--muted:#91a2b7;--green:#61ddb1;--selected:#20394a;--red:#f89898}
    [data-theme="light"]{color-scheme:light;--bg:#f4f7fa;--panel:#fff;--line:#dce3ec;--text:#223044;--muted:#5e7086;--green:#087d5a;--selected:#e4f3ed;--red:#bf3434}
    *{box-sizing:border-box}body{margin:0;font:13px "Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;gap:16px}h1{font-size:19px;margin:0 0 5px;font-weight:600}p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
    .live{display:flex;align-items:center;gap:7px;color:var(--green);white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.muted{color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0 24px 16px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:7px;font:600 22px "Consolas",monospace;font-variant-numeric:tabular-nums}.stat .upload{color:var(--green)}
    .toolbar{display:flex;gap:9px;padding:0 24px 14px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px}input{flex:1;min-width:220px}input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}button{cursor:pointer}button:hover{background:var(--selected)}button:disabled{opacity:.45;cursor:default}
    #error{margin:0 24px 12px;color:var(--red)}[hidden]{display:none!important}.table-wrap{min-height:120px;flex:1;overflow:auto;border-block:1px solid var(--line);background:var(--panel)}table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;white-space:nowrap}thead{position:sticky;top:0;z-index:1;background:var(--panel)}th{padding:0;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);font-weight:500}th button{border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:inherit;width:100%;padding:12px 13px}td{padding:10px 13px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover,tbody tr[aria-selected="true"]{background:var(--selected)}td .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}.target,.process{max-width:245px;overflow:hidden;text-overflow:ellipsis;display:block}.num{text-align:right;font-family:Consolas,monospace}.state{display:inline-block;border-radius:4px;font-size:11px;padding:3px 6px;background:var(--bg);color:var(--muted)}.state.active{color:var(--green)}.state.failed,.state.rejected{color:var(--red)}.empty{text-align:center!important;padding:48px;color:var(--muted);font-family:inherit;cursor:default}#details{padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;line-height:1.8;max-height:150px;overflow:auto;word-break:break-all}#details strong{color:var(--muted);font-weight:400}#details-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px}#detail-error{color:var(--red)}footer{padding:10px 24px 14px}footer .paging{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px;color:var(--muted);font-size:12px}footer button{padding:4px 10px}.page-buttons{display:flex;align-items:center;gap:9px}.hint{font-size:11px;color:var(--muted);line-height:1.7}
    @media(max-width:1000px){header{padding:14px 18px}.stats{margin-inline:18px;gap:8px}.stat{padding:10px}.stat strong{font-size:18px}.toolbar{padding-inline:18px}#details-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <header><div><h1>实时连接</h1><p>查看 Agent 启动后处理的连接，点选一行查看完整信息。</p></div><div class="live" id="live-state"><i class="dot"></i><span id="live-label">正在连接监控</span></div></header>
  <section class="stats" aria-label="当前会话统计">
    <div class="stat"><span>活跃连接</span><strong id="active">0</strong></div>
    <div class="stat"><span>↑ 上传速率</span><strong class="upload" id="upload-rate">0 B/s</strong></div>
    <div class="stat"><span>↓ 下载速率</span><strong id="download-rate">0 B/s</strong></div>
    <div class="stat"><span>累计上传 · 本次运行</span><strong id="upload">0 B</strong></div>
    <div class="stat"><span>累计下载 · 本次运行</span><strong id="download">0 B</strong></div>
  </section>
  <div class="toolbar">
    <input id="search" type="search" aria-label="筛选连接" placeholder="搜索进程、PID、域名、IP、端口或规则" autocomplete="off">
    <select id="state-filter" aria-label="连接状态"><option value="active">活跃连接</option><option value="all">全部（含最近结束）</option><option value="finished">最近结束</option><option value="failed">失败 / 阻断</option></select>
    <select id="protocol-filter" aria-label="协议筛选"><option value="">全部协议</option><option value="tcp">TCP</option><option value="udp">UDP</option></select>
    <select id="action-filter" aria-label="路由动作筛选"><option value="">全部动作</option><option value="PROXY">代理</option><option value="DIRECT">直连</option><option value="REJECT">阻断</option></select>
    <button id="pause" type="button" aria-pressed="false">暂停刷新</button>
  </div>
  <p id="error" role="status" hidden></p>
  <div class="table-wrap">
    <table aria-label="连接列表"><thead><tr>
      <th><button data-sort="process_name">进程 / PID</button></th><th><button data-sort="host">域名 / IP</button></th><th><button data-sort="port">端口</button></th><th><button data-sort="protocol">协议 / 入口</button></th><th><button data-sort="action">动作 / 规则</button></th><th class="num"><button data-sort="upload_rate">↑ 速率</button></th><th class="num"><button data-sort="download_rate">↓ 速率</button></th><th class="num"><button data-sort="upload">累计上传</button></th><th class="num"><button data-sort="download">累计下载</button></th><th><button data-sort="state">状态</button></th><th class="num"><button data-sort="duration">时长 ↕</button></th>
    </tr></thead><tbody id="connections"><tr><td colspan="11" class="empty">等待连接数据…</td></tr></tbody></table>
  </div>
  <section id="details" hidden aria-label="选中连接的详细信息"><div id="details-grid"></div><div id="detail-error"></div></section>
  <footer>
    <div class="paging"><span id="row-count">0 条连接</span><div class="page-buttons"><button id="previous">上一页</button><span id="page">1 / 1</span><button id="next">下一页</button></div><span id="sample-time">尚未采样</span></div>
    <p class="hint">每秒刷新，速率取近 2 秒平均。保留最近 512 条结束记录。透明直连按数据包载荷计数（含重传），代理按传输载荷计数，不含隧道开销。域名标注“DNS 关联”时可能并非应用请求的名称；无法确定时显示 IP。</p>
  </footer>
  <script src="connections.js"></script>
</body>
</html>
