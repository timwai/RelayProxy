name: One-time subscription proxy gofmt
on:
  push:
    branches:
      - feature/routing-rule-subscriptions
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format subscription changes
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w agent/routing/subscription.go agent/routing/subscription_test.go agent/routing/engine.go agent/routing/dialer.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- agent/routing/subscription.go agent/routing/subscription_test.go agent/routing/engine.go agent/routing/dialer.go
            git commit -m "style: gofmt subscription proxy fetch changes"
            git push origin HEAD:feature/routing-rule-subscriptions
          fi
