name: Go CI

on:
  push:
    branches:
      - main
      - "perf/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          git fetch origin main --depth=1
          files="$(git diff --name-only origin/main...HEAD -- '*.go')"
          if [ -z "$files" ]; then
            exit 0
          fi
          bad="$(gofmt -l $files)"
          if [ -n "$bad" ]; then
            gofmt -d $bad
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race core data path
        run: go test -race ./internal/tunnel ./server/session ./server/gateway ./agent/exit -count=1
      - name: Benchmark smoke
        run: |
          go test ./internal/tunnel ./internal/protocol ./internal/traffic ./server/gateway ./agent/exit ./agent/client \
            -run=NoUnitTestsInBenchmarkSmoke \
            -bench=Benchmark \
            -benchmem \
            -benchtime=100ms \
            -count=1
