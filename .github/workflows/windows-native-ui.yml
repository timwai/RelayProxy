name: Windows Native UI

on:
  push:
    branches:
      - main
      - feat/windows-native-gui
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/bridge/bridge.go"
      - "agent/gui/web.go"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"
  pull_request:
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/bridge/bridge.go"
      - "agent/gui/web.go"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - name: Normalize native bridge Go formatting
        run: |
          files=(
            agent/bridge/bridge.go
            agent/gui/web.go
            agent/gui/web_test.go
            agent/startup/startup_windows.go
            agent/startup/startup_other.go
            cmd/relay-agent/main.go
            scripts/fetch-windivert.go
          )
          gofmt -w "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "style: gofmt Windows native bridge"
            git push origin HEAD:feat/windows-native-gui
          fi
      - name: Verify native bridge Go formatting
        run: |
          files=(
            agent/bridge/bridge.go
            agent/gui/web.go
            agent/gui/web_test.go
            agent/startup/startup_windows.go
            agent/startup/startup_other.go
            cmd/relay-agent/main.go
            scripts/fetch-windivert.go
          )
          test -z "$(gofmt -l "${files[@]}")"

  build:
    needs: format
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            goarch: amd64
            artifact: windows-amd64-native
          - runtime: win-arm64
            platform: ARM64
            goarch: arm64
            artifact: windows-arm64-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test native Core bridge
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/gui ./agent/bridge ./agent/startup -count=1

      - name: Validate PowerShell release script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\build.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "scripts/build.ps1 has syntax errors"
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj -r ${{ matrix.runtime }}

      - name: Build
        shell: pwsh
        run: dotnet build .\windows\RelayProxy.Native\RelayProxy.Native.csproj -c Release -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} --no-restore

      - name: Publish native GUI
        shell: pwsh
        run: |
          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            --self-contained true `
            --no-restore `
            -o .\artifacts\${{ matrix.runtime }}

      - name: Build Go Agent core
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -o ".\artifacts\${{ matrix.runtime }}\relay-agent.exe" .\cmd\relay-agent

      - name: Verify release layout
        shell: pwsh
        run: |
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent-gui.exe")) { throw "relay-agent-gui.exe missing" }
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent.exe")) { throw "relay-agent.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .\artifacts\${{ matrix.runtime }}
          if-no-files-found: error
