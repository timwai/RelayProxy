name: Wails Windows GUI validation

on:
  push:
    branches:
      - feature/wails-windows-gui
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/wails-windows-gui
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format and tidy
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w agent/gui/*.go
          go mod tidy
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum agent/gui
            git commit -m "chore(gui): format and tidy Wails migration"
            git push origin HEAD:feature/wails-windows-gui
          fi

      - name: GUI unit tests
        run: go test ./agent/gui ./agent/bridge ./cmd/relay-agent

      - name: Compile Windows GUI tests
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -c ./agent/gui -o /tmp/relay-gui-amd64.test.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go test -c ./agent/gui -o /tmp/relay-gui-arm64.test.exe

      - name: Build Windows amd64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui" -o /tmp/relay-agent-gui-amd64.exe ./cmd/relay-agent

      - name: Build Windows arm64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-H=windowsgui" -o /tmp/relay-agent-gui-arm64.exe ./cmd/relay-agent

      - name: Verify Wails bridge contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "gui.WailsService." agent/gui/assets/wails-bridge.js
          grep -F "func (s *WailsService) GetConfig" agent/gui/bindings_windows.go
          grep -F "func (s *WailsService) GetConnections" agent/gui/bindings_windows.go
