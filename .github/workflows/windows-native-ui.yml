name: Windows Native UI

on:
  push:
    branches:
      - main
      - feat/windows-native-gui
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/app/**"
      - "agent/routing/**"
      - "internal/config/**"
      - "internal/messageutil/**"
      - "server/api/message_rule_v2.go"
      - "server/api/push.go"
      - "server/repository/db.go"
      - "server/repository/message_rules_test.go"
      - "agent/bridge/bridge.go"
      - "agent/gui/**"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "cmd/relay-agent-win-launcher/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/pack-windows-launcher.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"
  pull_request:
    paths:
      - "windows/RelayProxy.Native/**"
      - "agent/app/**"
      - "agent/routing/**"
      - "internal/config/**"
      - "internal/messageutil/**"
      - "server/api/message_rule_v2.go"
      - "server/api/push.go"
      - "server/repository/db.go"
      - "server/repository/message_rules_test.go"
      - "agent/bridge/bridge.go"
      - "agent/gui/**"
      - "agent/startup/**"
      - "cmd/relay-agent/**"
      - "cmd/relay-agent-win-launcher/**"
      - "scripts/fetch-windivert.go"
      - "scripts/build-windows-native.ps1"
      - "scripts/pack-windows-launcher.ps1"
      - "scripts/build.ps1"
      - ".github/workflows/windows-native-ui.yml"

permissions:
  contents: read

concurrency:
  group: windows-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Check native bridge Go formatting
        run: |
          files=(
            agent/app/agent.go
            agent/app/status_capabilities_test.go
            agent/routing/dialer.go
            agent/routing/dialer_test.go
            internal/config/config.go
            internal/messageutil/message_rules.go
            internal/messageutil/message_rules_test.go
            server/api/message_rule_v2.go
            server/api/push.go
            server/repository/db.go
            server/repository/message_rules_test.go
            agent/bridge/bridge.go
            agent/gui/web.go
            agent/gui/web_test.go
            agent/gui/gui_windows_core.go
            agent/gui/gui_windows.go
            agent/gui/bindings_windows.go
            agent/gui/connections_windows.go
            agent/gui/restart_windows.go
            agent/gui/connections_native_windows_test.go
            agent/gui/restart_windows_test.go
            agent/startup/startup_windows.go
            agent/startup/startup_other.go
            cmd/relay-agent/main.go
            cmd/relay-agent-win-launcher/main.go
            cmd/relay-agent-win-launcher/messagebox_windows.go
            cmd/relay-agent-win-launcher/messagebox_other.go
            cmd/relay-agent-win-launcher/main_test.go
            scripts/fetch-windivert.go
          )
          bad="$(gofmt -l "${files[@]}")"
          if [ -n "$bad" ]; then
            for file in $bad; do
              gofmt -d "$file"
            done
            exit 1
          fi

  build:
    needs: format
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            goarch: amd64
            exe: RelayProxy-agent-windows-amd64.exe
            artifact: windows-amd64-native
          - runtime: win-arm64
            platform: ARM64
            goarch: arm64
            exe: RelayProxy-agent-windows-arm64.exe
            artifact: windows-arm64-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Test native Core bridge
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/gui ./agent/bridge ./agent/startup -count=1

      - name: Test legacy Wails fallback
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test -tags wailslegacy ./agent/gui -count=1

      - name: Test Agent runtime status
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/app -run '^TestStatus' -count=1

      - name: Test proxy pause routing
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test ./agent/routing -run TestRoutingProxyPauseRejectsTCPAndUDPProxyDials -count=1

      - name: Test message rule popup types
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          go test ./internal/messageutil -run 'TestMessageRule.*PopupType|TestValidateMessageRuleRejectsInvalidPopupType' -count=1
          go test ./server/repository -run TestLegacyMessageRulesPreservePopupType -count=1

      - name: Validate PowerShell release scripts
        shell: pwsh
        run: |
          $scripts = @(
            ".\scripts\build.ps1",
            ".\scripts\build-windows-native.ps1",
            ".\scripts\pack-windows-launcher.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              throw "$script has syntax errors"
            }
          }

      - name: Test rename-safe launcher
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: go test .\cmd\relay-agent-win-launcher -count=1

      - name: Restore
        shell: pwsh
        run: dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj -r ${{ matrix.runtime }} -p:PublishTrimmed=true

      - name: Verify Windows 10 compatibility declaration
        shell: pwsh
        run: |
          $manifest = Get-Content ".\windows\RelayProxy.Native\app.manifest" -Raw
          if (-not $manifest.Contains('maxversiontested Id="10.0.17763.0"')) {
            throw "Windows 10 maxversiontested declaration is missing"
          }
          $project = Get-Content ".\windows\RelayProxy.Native\RelayProxy.Native.csproj" -Raw
          if (-not $project.Contains("<SupportedOSPlatformVersion>10.0.17763.0</SupportedOSPlatformVersion>")) {
            throw "SupportedOSPlatformVersion is not pinned to Windows 10 1809"
          }

      - name: Build
        shell: pwsh
        run: dotnet build .\windows\RelayProxy.Native\RelayProxy.Native.csproj -c Release -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} --no-restore

      - name: Build embedded Go Agent core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\staging\${{ matrix.runtime }}" -Force | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o ".\staging\${{ matrix.runtime }}\relay-agent.exe" .\cmd\relay-agent

      - name: Publish fixed-name WinUI host payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\host\${{ matrix.runtime }}" -Force | Out-Null
          $core = (Resolve-Path ".\staging\${{ matrix.runtime }}\relay-agent.exe").Path
          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:SuppressTrimAnalysisWarnings=false `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:RelayAgentCorePath="$core" `
            --self-contained true `
            --no-restore `
            -o .\host\${{ matrix.runtime }}

      - name: Build rename-safe portable EXE
        shell: pwsh
        run: |
          $hostDir = ".\host\${{ matrix.runtime }}"
          $nativeHost = Join-Path $hostDir "RelayProxy.NativeHost.exe"
          if (-not (Test-Path $nativeHost)) { throw "RelayProxy.NativeHost.exe missing from WinUI host publish" }
          $extra = @(Get-ChildItem -LiteralPath $hostDir -Force | Where-Object { $_.Name -ne "RelayProxy.NativeHost.exe" })
          if ($extra.Count -gt 0) {
            throw "WinUI host publish has sidecars: $($extra.Name -join ', ')"
          }

          New-Item -ItemType Directory -Path ".\single\${{ matrix.runtime }}" -Force | Out-Null
          New-Item -ItemType Directory -Path ".\artifacts\${{ matrix.runtime }}" -Force | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          $stub = ".\staging\${{ matrix.runtime }}\relayproxy-launcher.exe"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o $stub .\cmd\relay-agent-win-launcher
          if ($LASTEXITCODE -ne 0) { throw "rename-safe launcher build failed" }

          $exe = ".\single\${{ matrix.runtime }}\${{ matrix.exe }}"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\pack-windows-launcher.ps1 -Launcher $stub -Payload $nativeHost -Output $exe
          if ($LASTEXITCODE -ne 0) { throw "launcher payload packing failed" }

          $core = ".\staging\${{ matrix.runtime }}\relay-agent.exe"
          $finalBytes = (Get-Item $exe).Length
          $hostBytes = (Get-Item $nativeHost).Length
          $coreBytes = (Get-Item $core).Length
          $overheadBytes = [Math]::Max(0, $finalBytes - $hostBytes)
          $finalMb = [math]::Round($finalBytes / 1MB, 2)
          $hostMb = [math]::Round($hostBytes / 1MB, 2)
          $coreMb = [math]::Round($coreBytes / 1MB, 2)
          $overheadMb = [math]::Round($overheadBytes / 1MB, 2)
          Write-Host "[size] rename-safe EXE: $finalMb MB"
          Write-Host "[size] trimmed WinUI host: $hostMb MB"
          Write-Host "[size] embedded Go Core: $coreMb MB"
          Write-Host "[size] launcher/footer overhead: ~$overheadMb MB"
          $sizeBudgetMb = 80
          if ($finalBytes -gt ($sizeBudgetMb * 1MB)) {
            throw "Rename-safe native EXE exceeds ${sizeBudgetMb} MiB size budget: $finalMb MiB"
          }
          Write-Host "[size] budget: <= $sizeBudgetMb MiB (PASS)" -ForegroundColor Green
          Write-Host "::notice title=Rename-safe native package::${{ matrix.runtime }} = $finalMb MB; host = $hostMb MB"
          @"
          ### ${{ matrix.runtime }} rename-safe native package
          | Item | Size |
          | --- | ---: |
          | ${{ matrix.exe }} | $finalMb MB |
          | trimmed fixed-name WinUI host | $hostMb MB |
          | embedded Go Core | $coreMb MB |
          | launcher/footer overhead | $overheadMb MB |

          The distributed EXE is a rename-safe Go launcher. It extracts the fixed-name WinUI host to the user cache, so changing the outer EXE filename does not affect XAML resource resolution. The WinUI host uses single-file compression plus partial trimming. CI enforces an 80 MiB final size budget.
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          Copy-Item $exe ".\artifacts\${{ matrix.runtime }}\${{ matrix.exe }}" -Force
      - name: Smoke test arbitrary EXE rename
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $source = (Resolve-Path ".\single\${{ matrix.runtime }}\${{ matrix.exe }}").Path
          $renamed = Join-Path (Split-Path -Parent $source) "anything-user-wants.exe"
          Copy-Item $source $renamed -Force
          $process = $null
          try {
            $process = Start-Process -FilePath $renamed -ArgumentList "--minimized" -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $startupLog = Join-Path $env:TEMP "RelayProxy\startup.log"
              if (Test-Path $startupLog) { Get-Content $startupLog -Tail 100 | Write-Host }
              throw "Renamed portable EXE exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "[smoke] arbitrarily renamed EXE stayed alive for 8 seconds." -ForegroundColor Green
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Get-Process "RelayProxy.NativeHost" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process "relay-agent" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item $renamed -Force -ErrorAction SilentlyContinue
          }
      - name: Build Go Agent core
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -o ".\artifacts\${{ matrix.runtime }}\relay-agent.exe" .\cmd\relay-agent

      - name: Build legacy Wails fallback
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -trimpath -tags wailslegacy -ldflags "-H=windowsgui" -o ".\artifacts\${{ matrix.runtime }}\relay-agent-wails.exe" .\cmd\relay-agent

      - name: Verify release layout
        shell: pwsh
        run: |
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\${{ matrix.exe }}")) { throw "${{ matrix.exe }} missing" }
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent.exe")) { throw "relay-agent.exe missing" }
          if (-not (Test-Path ".\artifacts\${{ matrix.runtime }}\relay-agent-wails.exe")) { throw "relay-agent-wails.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .\artifacts\${{ matrix.runtime }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RelayProxy-agent-${{ matrix.runtime }}-single-exe
          path: .\single\${{ matrix.runtime }}\${{ matrix.exe }}
          if-no-files-found: error
      - name: Publish lean Windows App SDK experiment
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          Remove-Item ".\windows\RelayProxy.Native\obj" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -r win-x64 `
            -p:PublishTrimmed=true `
            -p:RelayProxyLeanWindowsAppSdk=true

          $assets = Get-Content ".\windows\RelayProxy.Native\obj\project.assets.json" -Raw
          $forbidden = @(
            '"Microsoft.WindowsAppSDK.AI/',
            '"Microsoft.WindowsAppSDK.ML/',
            '"Microsoft.WindowsAppSDK.Search/',
            '"Microsoft.WindowsAppSDK.Widgets/',
            '"Microsoft.WindowsAppSDK.DWrite/'
          )
          foreach ($package in $forbidden) {
            if ($assets.Contains($package)) {
              throw "Unused Windows App SDK component leaked into lean graph: $package"
            }
          }

          New-Item -ItemType Directory -Path ".\lean\host" -Force | Out-Null
          New-Item -ItemType Directory -Path ".\lean\single" -Force | Out-Null
          $core = (Resolve-Path ".\staging\win-x64\relay-agent.exe").Path
          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:RelayProxyLeanWindowsAppSdk=true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:SuppressTrimAnalysisWarnings=false `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:RelayAgentCorePath="$core" `
            --self-contained true `
            --no-restore `
            -o .\lean\host

          $nativeHost = ".\lean\host\RelayProxy.NativeHost.exe"
          if (-not (Test-Path $nativeHost)) { throw "lean RelayProxy.NativeHost.exe missing" }
          $extra = @(Get-ChildItem ".\lean\host" -Force | Where-Object { $_.Name -ne "RelayProxy.NativeHost.exe" })
          if ($extra.Count -gt 0) { throw "lean WinUI host has sidecars: $($extra.Name -join ', ')" }

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $stub = ".\lean\relayproxy-launcher.exe"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o $stub .\cmd\relay-agent-win-launcher
          if ($LASTEXITCODE -ne 0) { throw "lean launcher build failed" }

          $exe = ".\lean\single\RelayProxy-agent-windows-amd64-lean.exe"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\pack-windows-launcher.ps1 -Launcher $stub -Payload $nativeHost -Output $exe
          if ($LASTEXITCODE -ne 0) { throw "lean launcher packing failed" }

          $finalMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $hostMb = [math]::Round((Get-Item $nativeHost).Length / 1MB, 2)
          Write-Host "[lean-size] rename-safe EXE: $finalMb MB"
          Write-Host "[lean-size] fixed-name WinUI host: $hostMb MB"
          if ((Get-Item $exe).Length -gt (65MB)) {
            throw "Lean rename-safe EXE exceeds 65 MiB experimental budget: $finalMb MiB"
          }

          $renamed = ".\lean\single\user-renamed-lean-client.exe"
          Copy-Item $exe $renamed -Force
          $process = $null
          try {
            $process = Start-Process -FilePath $renamed -ArgumentList "--minimized" -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $startupLog = Join-Path $env:TEMP "RelayProxy\startup.log"
              if (Test-Path $startupLog) { Get-Content $startupLog -Tail 100 | Write-Host }
              throw "Lean renamed EXE exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "[lean-smoke] arbitrarily renamed lean EXE stayed alive for 8 seconds." -ForegroundColor Green
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Get-Process "RelayProxy.NativeHost" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process "relay-agent" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item $renamed -Force -ErrorAction SilentlyContinue
          }

          @"
          ### win-x64 lean Windows App SDK experiment
          **Rename-safe EXE:** $finalMb MiB
          **Fixed-name WinUI host:** $hostMb MiB

          Uses Microsoft.WindowsAppSDK.WinUI + Runtime only, partial trimming, single-file compression, and the rename-safe outer launcher.
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'win-x64'
        with:
          name: RelayProxy-agent-win-x64-lean-experiment
          path: .\lean\single\RelayProxy-agent-windows-amd64-lean.exe
          if-no-files-found: error

      - name: Publish aggressive size experiment
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          Remove-Item ".\windows\RelayProxy.Native\obj" -Recurse -Force -ErrorAction SilentlyContinue
          dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -r win-x64 `
            -p:PublishTrimmed=true `
            -p:TrimMode=full `
            -p:RelayProxyLeanWindowsAppSdk=true `
            -p:DebuggerSupport=false `
            -p:EventSourceSupport=false `
            -p:MetadataUpdaterSupport=false `
            -p:MetricsSupport=false `
            -p:Http3Support=false `
            -p:HttpActivityPropagationSupport=false `
            -p:UseSizeOptimizedLinq=true `
            -p:EnableUnsafeBinaryFormatterSerialization=false `
            -p:EnableUnsafeUTF7Encoding=false

          Remove-Item ".\aggressive" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path ".\aggressive\host" -Force | Out-Null
          New-Item -ItemType Directory -Path ".\aggressive\single" -Force | Out-Null
          $core = (Resolve-Path ".\staging\win-x64\relay-agent.exe").Path

          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:RelayProxyLeanWindowsAppSdk=true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=true `
            -p:TrimMode=full `
            -p:SuppressTrimAnalysisWarnings=false `
            -p:DebuggerSupport=false `
            -p:EventSourceSupport=false `
            -p:MetadataUpdaterSupport=false `
            -p:MetricsSupport=false `
            -p:Http3Support=false `
            -p:HttpActivityPropagationSupport=false `
            -p:UseSizeOptimizedLinq=true `
            -p:EnableUnsafeBinaryFormatterSerialization=false `
            -p:EnableUnsafeUTF7Encoding=false `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:RelayAgentCorePath="$core" `
            --self-contained true `
            --no-restore `
            -o .\aggressive\host

          $nativeHost = ".\aggressive\host\RelayProxy.NativeHost.exe"
          if (-not (Test-Path $nativeHost)) { throw "aggressive RelayProxy.NativeHost.exe missing" }
          $extra = @(Get-ChildItem ".\aggressive\host" -Force | Where-Object { $_.Name -ne "RelayProxy.NativeHost.exe" })
          if ($extra.Count -gt 0) { throw "aggressive WinUI host has sidecars: $($extra.Name -join ', ')" }

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $stub = ".\aggressive\relayproxy-launcher.exe"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o $stub .\cmd\relay-agent-win-launcher
          if ($LASTEXITCODE -ne 0) { throw "aggressive launcher build failed" }

          $exe = ".\aggressive\single\RelayProxy-agent-windows-amd64-aggressive.exe"
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\pack-windows-launcher.ps1 -Launcher $stub -Payload $nativeHost -Output $exe
          if ($LASTEXITCODE -ne 0) { throw "aggressive launcher packing failed" }

          $finalMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          $hostMb = [math]::Round((Get-Item $nativeHost).Length / 1MB, 2)
          Write-Host "[aggressive-size] rename-safe EXE: $finalMb MB"
          Write-Host "[aggressive-size] fixed-name WinUI host: $hostMb MB"

          $renamed = ".\aggressive\single\user-renamed-aggressive-client.exe"
          Copy-Item $exe $renamed -Force
          $process = $null
          try {
            $process = Start-Process -FilePath $renamed -ArgumentList "--minimized" -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $startupLog = Join-Path $env:TEMP "RelayProxy\startup.log"
              if (Test-Path $startupLog) { Get-Content $startupLog -Tail 100 | Write-Host }
              throw "Aggressive renamed EXE exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "[aggressive-smoke] arbitrarily renamed aggressive EXE stayed alive for 8 seconds." -ForegroundColor Green
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Get-Process "RelayProxy.NativeHost" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process "relay-agent" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item $renamed -Force -ErrorAction SilentlyContinue
          }

          @"
          ### win-x64 aggressive size experiment
          **Rename-safe EXE:** $finalMb MiB
          **Fixed-name WinUI host:** $hostMb MiB

