name: Temporary gofmt correction
on:
  push:
    branches:
      - feature/routing-rule-subscriptions
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply gofmt to changed Go sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w agent/routing/subscription.go agent/routing/subscription_test.go agent/routing/engine.go agent/routing/validate.go agent/routing/rule.go agent/routing/compound.go agent/app/agent.go mobile/androidcore/client.go agent/gui/bindings_windows.go agent/bridge/bridge.go agent/gui/routing_config_view.go agent/gui/web.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- agent/routing/subscription.go agent/routing/subscription_test.go agent/routing/engine.go agent/routing/validate.go agent/routing/rule.go agent/routing/compound.go agent/app/agent.go mobile/androidcore/client.go agent/gui/bindings_windows.go agent/bridge/bridge.go agent/gui/routing_config_view.go agent/gui/web.go
            git commit -m "style: format subscription implementation with gofmt"
            git push origin HEAD:feature/routing-rule-subscriptions
          fi
