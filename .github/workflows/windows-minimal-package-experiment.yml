name: Windows Minimal Package Experiment

on:
  push:
    branches:
      - feat/windows-native-gui
    paths:
      - ".github/workflows/windows-minimal-package-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-minimal-package-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimal:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            goarch: amd64
            vcarch: x64
            exe: RelayProxy-agent-windows-amd64-minimal.exe
          - runtime: win-arm64
            platform: ARM64
            goarch: arm64
            vcarch: arm64
            exe: RelayProxy-agent-windows-arm64-minimal.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify nativecore route profile
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          go test -tags nativecore .\agent\gui -count=1
          if ($LASTEXITCODE -ne 0) { throw "nativecore route profile tests failed" }

      - name: Restore lean Windows App SDK graph
        shell: pwsh
        run: |
          dotnet restore .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -r ${{ matrix.runtime }} `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:RelayProxyLeanWindowsAppSdk=true
          if ($LASTEXITCODE -ne 0) { throw "minimal package restore failed" }

      - name: Build nativecore Go Agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\minimal\${{ matrix.runtime }}\staging" -Force | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $env:CGO_ENABLED = "0"
          go build -tags nativecore -trimpath -ldflags "-s -w" -o ".\minimal\${{ matrix.runtime }}\staging\relay-agent.exe" .\cmd\relay-agent
          if ($LASTEXITCODE -ne 0) { throw "minimal nativecore Go Agent build failed" }

      - name: Publish lean outer-only WinUI host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".\minimal\${{ matrix.runtime }}\host" -Force | Out-Null
          New-Item -ItemType Directory -Path ".\minimal\${{ matrix.runtime }}\single" -Force | Out-Null
          $core = (Resolve-Path ".\minimal\${{ matrix.runtime }}\staging\relay-agent.exe").Path

          dotnet publish .\windows\RelayProxy.Native\RelayProxy.Native.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -p:Platform=${{ matrix.platform }} `
            -p:RelayProxyLeanWindowsAppSdk=true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:SuppressTrimAnalysisWarnings=false `
            -p:EnableMsixTooling=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:RelayAgentCorePath="$core" `
            --self-contained true `
            --no-restore `
            -o ".\minimal\${{ matrix.runtime }}\host"
          if ($LASTEXITCODE -ne 0) { throw "minimal WinUI host publish failed" }

          $nativeHost = ".\minimal\${{ matrix.runtime }}\host\RelayProxy.NativeHost.exe"
          if (-not (Test-Path $nativeHost)) { throw "minimal RelayProxy.NativeHost.exe missing" }
          $extra = @(Get-ChildItem ".\minimal\${{ matrix.runtime }}\host" -Force | Where-Object { $_.Name -ne "RelayProxy.NativeHost.exe" })
          if ($extra.Count -gt 0) { throw "minimal WinUI host has sidecars: $($extra.Name -join ', ')" }

      - name: Build tiny native C launcher
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.vcarch }} -host_arch=x64
          cl /nologo /O1 /GL /MT /DUNICODE /D_UNICODE windows\RelayProxy.LzmsLauncher\launcher.c /Fe:minimal\${{ matrix.runtime }}\launcher-c.exe /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /LTCG
          if errorlevel 1 exit /b 1

      - name: Pack minimal LZMS EXE
        shell: pwsh
        run: |
          $stub = (Resolve-Path ".\minimal\${{ matrix.runtime }}\launcher-c.exe").Path
          $nativeHost = (Resolve-Path ".\minimal\${{ matrix.runtime }}\host\RelayProxy.NativeHost.exe").Path
          $exe = ".\minimal\${{ matrix.runtime }}\single\${{ matrix.exe }}"
          go run .\scripts\pack-windows-launcher-lzms.go -launcher $stub -payload $nativeHost -output $exe
          if ($LASTEXITCODE -ne 0) { throw "minimal LZMS packing failed" }

          $coreMb = [math]::Round((Get-Item ".\minimal\${{ matrix.runtime }}\staging\relay-agent.exe").Length / 1MB, 2)
          $stubMb = [math]::Round((Get-Item $stub).Length / 1MB, 3)
          $hostMb = [math]::Round((Get-Item $nativeHost).Length / 1MB, 2)
          $finalMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "[minimal-size] ${{ matrix.runtime }} Core: $coreMb MB"
          Write-Host "[minimal-size] ${{ matrix.runtime }} C launcher: $stubMb MB"
          Write-Host "[minimal-size] ${{ matrix.runtime }} Host: $hostMb MB"
          Write-Host "[minimal-size] ${{ matrix.runtime }} EXE: $finalMb MB"
          Write-Host "::notice title=Minimal package::${{ matrix.runtime }} = $finalMb MB; Core = $coreMb MB; C launcher = $stubMb MB"

          if ((Get-Item $exe).Length -gt (30MB)) {
            throw "Minimal package exceeds 30 MiB target: $finalMb MiB"
          }

          @"
          ### ${{ matrix.runtime }} minimal package experiment
          **NativeCore:** $coreMb MiB
          **C launcher:** $stubMb MiB
          **Uncompressed-inner Host:** $hostMb MiB
          **Rename-safe EXE:** $finalMb MiB
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Smoke test Unicode-renamed x64 package
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "RelayProxy\native-host-lzms-c-experiment"
          Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
          $source = (Resolve-Path ".\minimal\win-x64\single\${{ matrix.exe }}").Path
          $renamed = ".\minimal\win-x64\single\任意名称-RelayProxy.exe"
          Copy-Item $source $renamed -Force
          $process = $null
          try {
            $process = Start-Process -FilePath $renamed -ArgumentList "--minimized" -PassThru
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              $startupLog = Join-Path $env:TEMP "RelayProxy\startup.log"
              if (Test-Path $startupLog) { Get-Content $startupLog -Tail 100 | Write-Host }
              throw "Minimal Unicode-renamed x64 EXE exited with code $($process.ExitCode)."
            }
            Write-Host "[minimal-smoke] Unicode-renamed minimal x64 EXE stayed alive for 8 seconds." -ForegroundColor Green
          }
          finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Get-Process "RelayProxy.NativeHost" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process "relay-agent" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item $renamed -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RelayProxy-agent-${{ matrix.runtime }}-minimal-experiment
          path: .\minimal\${{ matrix.runtime }}\single\${{ matrix.exe }}
          if-no-files-found: error
