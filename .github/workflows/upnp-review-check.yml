name: UPnP review check

on:
  push:
    branches:
      - fix/p2p-upnp-review

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          test -z "$(gofmt -l internal/p2p/upnp/upnp.go internal/p2p/upnp/upnp_test.go agent/p2p/endpoint.go)"
      - name: Test UPnP and P2P
        run: go test ./internal/p2p/upnp ./agent/p2p
