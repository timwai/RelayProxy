name: UI CI

on:
  push:
    branches:
      - main
      - "feature/unified-ui-*"
      - "feature/wails-react-*"
  pull_request:
    paths:
      - "agent/gui/**"
      - "cmd/relay-agent/**"
      - "server/web/**"
      - "server/api/**"
      - "server/browser_sync/**"
      - "internal/browser_sync/**"
      - "browser/chrome-extension/**"
      - "internal/webui/**"
      - "internal/config/**"
      - "macos/**"
      - ".github/workflows/ui-ci.yml"
      - "scripts/build.sh"
      - "scripts/build.ps1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test and build Server React frontend
        working-directory: server/web/frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Test and build Wails React frontend
        working-directory: agent/gui/frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Require Browser Sync progress review with implementation changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep the maintained progress tracker newer than (or in the same
          # commit as) the last changed Browser Sync implementation file.
          # Git history is checked, not just presence in the cumulative PR
          # diff, so later code changes cannot reuse a stale tracker update.
          paths=(
            browser/chrome-extension/src
            browser/chrome-extension/tests
            browser/chrome-extension/manifest.json
            browser/chrome-extension/package.json
            server/browser_sync
            internal/browser_sync
            server/api/browser_sync.go
            server/web/frontend/src/BrowserSync.jsx
            internal/config/browser_sync_test.go
          )
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "${paths[@]}")"
          if [[ -z "$changed" ]]; then
            echo "No Browser Sync implementation changes in this PR"
            exit 0
          fi
          latest_code="$(git log -1 --format=%H "$HEAD_SHA" -- "${paths[@]}")"
          latest_doc="$(git log -1 --format=%H "$HEAD_SHA" -- docs/browser-session-sync-progress.md)"
          if [[ -z "$latest_code" || -z "$latest_doc" ]] || ! git merge-base --is-ancestor "$latest_code" "$latest_doc"; then
            echo "::error::Browser Sync changes must be followed by a review/update of docs/browser-session-sync-progress.md in this PR. Record affected IDs, evidence and any unchanged status."
            exit 1
          fi
          echo "Browser Sync progress document reviewed at or after latest implementation commit"
      - name: Validate agentless Chrome extension
        working-directory: browser/chrome-extension
        run: |
          node --check src/service-worker.js
          node --check src/server-api.js
          node --check src/device-identity.js
          node --check src/envelope.js
          node --check src/popup.js
          npm test
      - name: Check Go formatting
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          bad="$(gofmt -l $files)"
          if [ -n "$bad" ]; then
            gofmt -d $bad
            exit 1
          fi
      - name: Check release script syntax
        run: bash -n scripts/build.sh
      - name: Vet
        run: go vet ./...
      - name: Check remaining desktop JavaScript
        shell: bash
        run: |
          node --check agent/gui/assets/routing.js
          node --check agent/gui/assets/connections.js
          node --test agent/gui/assets/_config.test.cjs
      - name: Test UI scope
        run: go test ./agent/gui ./cmd/relay-agent ./internal/config ./internal/webui ./server/api ./server/web -count=1
      - name: Full regression
        shell: bash
        run: |
          if ! go test ./... -count=1; then
            echo "::warning::Full regression hit an intermittent integration failure; retrying the complete suite once."
            go test ./... -count=1
          fi

  desktop-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build shared desktop React frontend
        working-directory: agent/gui/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check PowerShell build script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts\build.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test desktop packages
        run: go test ./agent/divert ./agent/gui ./cmd/relay-agent -count=1
      - name: Build macOS desktop shell and Network Extension
        if: runner.os == 'macOS'
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/relay-agent" ./cmd/relay-agent
          brew install xcodegen
          (
            cd macos
            xcodegen generate
          )
          swiftc -swift-version 5 -O \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target "$(uname -m)-apple-macos11.0" \
            -framework AppKit -framework WebKit \
            macos/RelayProxyDesktop/AppDelegate.swift \
            macos/RelayProxyDesktop/main.swift \
            -o "$RUNNER_TEMP/RelayProxyDesktop"
          xcodebuild \
            -project macos/RelayProxyMac.xcodeproj \
            -scheme RelayProxyMacHost \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/RelayProxyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
